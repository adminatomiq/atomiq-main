Object.assign(NOTES.Biology,{
"Sexual Reproduction in Flowering Plants":["A flower has stamens (anther with pollen sacs) and a pistil (stigma, style, ovary with ovules).","Pollen grains form by microsporogenesis and are the male gametophyte (vegetative cell and generative cell). The embryo sac is the female gametophyte, with 7 cells and 8 nuclei.","Embryo sac: egg apparatus (egg and 2 synergids), 3 antipodals, and a central cell with 2 polar nuclei.","Pollination: autogamy (same flower), geitonogamy (same plant), xenogamy (different plants). Agents include wind, water, insects and birds.","Double fertilisation is unique to angiosperms: one male gamete fuses with the egg to make the zygote (2n); the other fuses with two polar nuclei to make the primary endosperm nucleus (3n).","After fertilisation: zygote becomes embryo, ovule becomes seed, ovary becomes fruit. Parthenocarpy is fruit without fertilisation. Apomixis is seed without fertilisation."],
"Reproductive Health":["Reproductive health means physical, emotional and social well-being in all matters of reproduction.","Contraception: natural (periodic abstinence, withdrawal, lactational amenorrhea), barrier (condoms, diaphragm), IUDs (Cu-T, LNG-IUS), pills, injectables, implants, and surgical methods (vasectomy, tubectomy).","MTP is legal in India within limits set by law and must be done under medical supervision.","STIs include gonorrhoea, syphilis, genital herpes and HIV. Condoms and avoiding shared needles reduce risk.","Infertility treatments (ART): IVF-ET, ZIFT, GIFT, ICSI and IUI.","Amniocentesis can detect genetic disorders but its use for sex determination is banned."],
"Molecular Basis of Inheritance":["DNA is the genetic material: Griffith's transformation, Avery-MacLeod-McCarty, and Hershey-Chase (radioactive S and P).","DNA is a double helix with antiparallel strands, 10 base pairs per turn. A pairs with T (2 hydrogen bonds); G pairs with C (3). DNA is wrapped on a histone octamer to form a nucleosome.","Replication is semi-conservative (Meselson-Stahl). The leading strand is made continuously; the lagging strand in Okazaki fragments.","Transcription makes mRNA using RNA polymerase. In eukaryotes the RNA is spliced, capped and tailed.","Genetic code: triplet, degenerate, unambiguous, universal. AUG is the start codon; UAA, UAG, UGA are stop codons. tRNA is the adaptor in translation.","Lac operon: lactose switches the genes on by binding the repressor.","DNA fingerprinting uses VNTRs. The Human Genome Project mapped about 3 billion base pairs."],
"Evolution":["Chemical evolution (Oparin and Haldane) came before life. The Miller-Urey experiment produced amino acids.","Evidence: fossils, comparative anatomy, embryology and biochemical similarity. Homologous organs show divergent evolution; analogous organs show convergent evolution.","Darwin: variation, struggle for existence and natural selection. de Vries: mutation theory.","Hardy-Weinberg: allele frequencies stay constant unless disturbed by selection, mutation, gene flow, genetic drift or recombination.","Selection can be stabilising, directional or disruptive. Peppered moths (industrial melanism) show natural selection.","Human line: Dryopithecus and Ramapithecus, then Australopithecus, Homo habilis, Homo erectus and Homo sapiens."],
"Human Health and Disease":["Innate immunity (barriers, phagocytes, fever) is present at birth. Acquired immunity is specific: B cells make antibodies, T cells give cell-mediated immunity.","Active immunity: your body makes antibodies (infection, vaccines). Passive immunity: ready-made antibodies are received (mother's milk, antiserum).","Diseases: typhoid (Salmonella), malaria (Plasmodium, spread by female Anopheles), dengue, amoebiasis, ascariasis, filariasis, ringworm.","AIDS is caused by HIV, a retrovirus that infects helper T cells. It spreads via blood, sexual contact and from mother to child. ELISA is the test.","Cancer is uncontrolled cell division. Benign tumours stay local; malignant ones spread (metastasis). Treatments: surgery, radiotherapy, chemotherapy.","Opioids, cannabinoids and cocaine are common drugs of abuse. Counselling helps prevention."],
"Microbes in Human Welfare":["At home: Lactobacillus turns milk into curd. Yeast makes dough rise.","In industry: Saccharomyces for wine and beer; Penicillium for penicillin; Aspergillus for citric acid; Acetobacter for acetic acid; Lactobacillus for lactic acid.","Enzymes and drugs: streptokinase removes blood clots, cyclosporin A suppresses the immune system, statins lower cholesterol.","Sewage treatment: primary (physical) then secondary (biological, activated sludge). BOD measures organic pollution.","Biogas: methanogens digest dung without oxygen and produce methane.","Biocontrol: Bt, Trichoderma and baculovirus. Biofertilisers: Rhizobium, Azospirillum, cyanobacteria and mycorrhiza."],
"Biotechnology: Principles and Processes":["Tools of rDNA technology: restriction enzymes (cut at palindromic sites), DNA ligase (joins), vectors such as plasmids, and host cells.","Steps: isolate DNA, cut with restriction enzymes, join into a vector, transfer to a host, then culture and harvest the product.","A good vector has an origin of replication, a selectable marker and cloning sites. Insertional inactivation helps pick recombinants.","Gel electrophoresis separates DNA by size. DNA moves towards the positive electrode and is stained with ethidium bromide.","PCR copies DNA using primers and heat-stable Taq polymerase in cycles of denaturation, annealing and extension.","Stirred-tank bioreactors make large quantities of product, followed by downstream processing."],
"Biotechnology and its Applications":["GM crops: Bt cotton (cry genes kill insects), RNA interference for pest resistance, and Golden Rice with vitamin A.","Medicine: human insulin from E. coli (separate A and B chains joined), gene therapy for ADA deficiency, diagnosis by PCR and ELISA.","Transgenic animals are used for making vaccines and human proteins, and for testing chemical safety. Rosie the cow made human α-lactalbumin in her milk.","Biopiracy is using biological resources without proper authorisation. GEAC checks the safety of GM research.","Patents protect inventions. Ethical concerns decide how far biotechnology should go."],
"Organisms and Populations":["Levels of biological organisation: organism, population, community, ecosystem, biome.","Regulators keep internal conditions constant. Conformers change with the environment. Others migrate or suspend activity (hibernation, aestivation, diapause).","Population growth: exponential (J-shaped) when resources are unlimited; logistic (S-shaped) when growth levels off at the carrying capacity K.","Interactions: mutualism (+,+), competition (−,−), predation (+,−), parasitism (+,−), commensalism (+,0), amensalism (−,0).","Allen's rule: mammals in cold regions have shorter ears and limbs.","Competitive exclusion: two closely related species competing for the same resource cannot coexist for long."],
"Biodiversity and Conservation":["Biodiversity has three levels: genetic, species and ecological.","Species richness is highest in the tropics and rises with area.","The 'evil quartet' of causes for loss: habitat loss, over-exploitation, alien species invasion and co-extinction.","In situ conservation: national parks, sanctuaries, biosphere reserves, sacred groves. Ex situ conservation: zoos, botanical gardens, seed banks, cryopreservation.","Biodiversity hotspots have high endemism and are under threat. Examples: Western Ghats and Sri Lanka, Himalaya, Indo-Burma.","Biodiversity gives ecosystem services such as pollination, oxygen and climate regulation."]
});

prop:[
["Ligand substitution and colour",[
 ["Cobalt(II): pink ⇌ blue","[Co(H₂O)₆]²⁺ + 4Cl⁻ ⇌ [CoCl₄]²⁻ + 6H₂O",{c:"Add conc. HCl, or heat",m:[["Cl⁻ replaces the water ligands; the shape changes from octahedral to tetrahedral."],["Tetrahedral splitting is small, Δt ≈ (4/9)Δo, so the complex absorbs lower-energy light."],["The colour shifts from pink to blue. Adding water pushes the equilibrium back."]],n:"Le Chatelier's principle applied to complexes."}],
 ["Nickel(II) with ammonia","[Ni(H₂O)₆]²⁺ + 6NH₃ → [Ni(NH₃)₆]²⁺ + 6H₂O",{m:[["NH₃ is above H₂O in the spectrochemical series."],["Δo increases, so the light absorbed shifts to higher energy."],["The colour changes from green to blue-violet."]]}],
 ["Nickel(II) with en: chelate effect","[Ni(H₂O)₆]²⁺ + 3en → [Ni(en)₃]²⁺ + 6H₂O",{m:[["Each en binds through two N atoms (bidentate), forming a five-membered ring."],["3 en molecules release 6 water molecules. The number of free particles rises, so entropy increases."],["This makes chelate complexes much more stable than similar complexes of monodentate ligands."]],n:"Colour: green → violet."}],
 ["Cu²⁺ with KF and KCl","[Cu(H₂O)₄]²⁺ + 4F⁻ → [CuF₄]²⁻ + 4H₂O",{m:[["F⁻ replaces water, giving a green precipitate of the fluoro complex."],["With Cl⁻, a bright green solution of the chloro complex forms.","[Cu(H₂O)₄]²⁺ + 4Cl⁻ → [CuCl₄]²⁻ + 4H₂O"]]}],
 ["Fe³⁺ with thiocyanate","[Fe(H₂O)₆]³⁺ + SCN⁻ → [Fe(H₂O)₅(SCN)]²⁺ + H₂O",{m:[["SCN⁻ replaces one water ligand."],["The new complex absorbs strongly through charge transfer, giving a blood-red colour."]],n:"Test for Fe³⁺. SCN⁻ is ambidentate: it can bind through S or N."}]
]],
["Werner's experiments (counting ions)",[
 ["[Co(NH₃)₆]Cl₃ with AgNO₃","[Co(NH₃)₆]Cl₃ + 3AgNO₃ → 3AgCl↓ + [Co(NH₃)₆](NO₃)₃",{m:[["All 3 Cl⁻ are outside the coordination sphere (primary valency)."],["They are free ions in solution, so all 3 precipitate as AgCl."]],n:"1:3 electrolyte: 4 ions in solution."}],
 ["[CoCl(NH₃)₅]Cl₂ with AgNO₃","[CoCl(NH₃)₅]Cl₂ + 2AgNO₃ → 2AgCl↓ + [CoCl(NH₃)₅](NO₃)₂",{m:[["One Cl⁻ is bonded to Co (secondary valency) and does not ionise."],["Only the 2 outer Cl⁻ precipitate."]],n:"1:2 electrolyte: 3 ions in solution."}],
 ["[CoCl₂(NH₃)₄]Cl with AgNO₃","[CoCl₂(NH₃)₄]Cl + AgNO₃ → AgCl↓ + [CoCl₂(NH₃)₄]NO₃",{m:[["Two Cl⁻ are coordinated; only one is outside."],["So only 1 mol of AgCl forms per mol of complex."]],n:"1:1 electrolyte. This complex has green (trans) and violet (cis) isomers."}],
 ["Ionisation isomer test: sulphate outside","[Co(NH₃)₅Br]SO₄ + BaCl₂ → BaSO₄↓ + [Co(NH₃)₅Br]Cl₂",{m:[["SO₄²⁻ is the counter ion, so it is free and gives white BaSO₄ with Ba²⁺."],["Br⁻ is coordinated, so AgNO₃ gives no AgBr."]]}],
 ["Ionisation isomer test: bromide outside","[Co(NH₃)₅SO₄]Br + AgNO₃ → AgBr↓ + [Co(NH₃)₅SO₄]NO₃",{m:[["Br⁻ is the counter ion, so it gives pale yellow AgBr."],["SO₄²⁻ is coordinated, so BaCl₂ gives no BaSO₄."]]}]
]],
["Applications",[
 ["Water hardness (EDTA)","Ca²⁺ + EDTA⁴⁻ → [Ca(EDTA)]²⁻",{m:[["EDTA⁴⁻ is hexadentate: 2 N and 4 O donor atoms wrap around the metal ion."],["The five chelate rings make the complex very stable."],["Ca²⁺ and Mg²⁺ are titrated this way; Eriochrome Black T marks the end point."]]}],
 ["Chelation therapy","Pb²⁺ + [Ca(EDTA)]²⁻ → [Pb(EDTA)]²⁻ + Ca²⁺",{m:[["EDTA binds toxic Pb²⁺ more strongly than Ca²⁺, so Pb²⁺ replaces Ca²⁺."],["The soluble lead complex is removed from the body in urine."]],n:"Similarly, D-penicillamine and desferrioxamine B remove excess copper and iron."}]
]]
],
named:[
["Named processes",[
 ["Mond process (refining nickel)","Ni + 4CO → [Ni(CO)₄] → Ni + 4CO",{c:"Form at 330-350 K; decompose at 450-470 K",m:[["Impure Ni is heated in a stream of CO at 330-350 K. Ni reacts to form volatile [Ni(CO)₄].","Ni + 4CO → [Ni(CO)₄]"],["Impurities are left behind as solids."],["The vapour moves to a hotter zone at 450-470 K, where the complex breaks down.","[Ni(CO)₄] → Ni + 4CO"],["Pure Ni deposits and the CO is reused."]],n:"Vapour-phase refining that relies on forming and breaking a complex."}],
 ["Cyanide process (MacArthur-Forrest) for Au and Ag","4Au + 8CN⁻ + 2H₂O + O₂ → 4[Au(CN)₂]⁻ + 4OH⁻",{c:"Dilute NaCN or KCN, air blown through",m:[["Leaching: O₂ oxidises Au(0) → Au(+1); CN⁻ traps it as the soluble linear complex [Au(CN)₂]⁻."],["Displacement: Zn, a more reactive metal, reduces the complex and frees the metal.","2[Au(CN)₂]⁻ + Zn → [Zn(CN)₄]²⁻ + 2Au"],["Silver is extracted the same way.","4Ag + 8CN⁻ + 2H₂O + O₂ → 4[Ag(CN)₂]⁻ + 4OH⁻"]],n:"Forming a stable complex makes a noble metal easy to oxidise."}],
 ["Wilkinson's catalyst (hydrogenation)","RCH=CH₂ + H₂ → RCH₂CH₃",{c:"[RhCl(PPh₃)₃], room temperature",m:[["One PPh₃ leaves, creating an empty site on Rh(I)."],["H₂ adds to Rh (oxidative addition): Rh(I) → Rh(III)."],["The alkene binds to Rh and inserts into an Rh-H bond."],["The second H moves to carbon (reductive elimination), releasing the alkane and regenerating Rh(I)."]],n:"A homogeneous catalyst for hydrogenating alkenes."}]
]],
["Named tests (salt analysis)",[
 ["Brown ring test (NO₃⁻)","[Fe(H₂O)₆]²⁺ + NO → [Fe(H₂O)₅(NO)]²⁺ + H₂O",{c:"Fresh FeSO₄ + nitrate solution; conc. H₂SO₄ poured slowly down the side",m:[["Fe²⁺ reduces nitrate to NO in the acid layer.","NO₃⁻ + 3Fe²⁺ + 4H⁺ → NO + 3Fe³⁺ + 2H₂O"],["NO replaces one water ligand on the iron complex."],["The brown complex forms where the two layers meet. In it, Fe is +1 and the ligand is NO⁺."]],n:"Confirmatory test for nitrate."}],
 ["Prussian blue test (Fe³⁺)","4Fe³⁺ + 3[Fe(CN)₆]⁴⁻ → Fe₄[Fe(CN)₆]₃",{c:"Potassium hexacyanoferrate(II), K₄[Fe(CN)₆]",m:[["Free Fe³⁺ ions combine with hexacyanoferrate(II) ions."],["The deep blue colour comes from electron transfer between the Fe(II) and Fe(III) sites."]],n:"Turnbull's blue (Fe²⁺ + K₃[Fe(CN)₆]) turns out to be the same compound."}],
 ["Chugaev test (Ni²⁺ with dmg)","Ni²⁺ + 2dmgH₂ → [Ni(dmgH)₂]↓ + 2H⁺",{c:"Ammoniacal solution",m:[["Each dimethylglyoxime loses one H⁺ and binds Ni through two N atoms (bidentate)."],["Two such ligands give a square planar complex (dsp², diamagnetic)."],["O-H···O hydrogen bonds between the two ligands make it extra stable; NH₃ removes the H⁺ formed."]],n:"Rosy-red precipitate: confirmatory test for Ni²⁺."}],
 ["Sodium nitroprusside test (S²⁻)","S²⁻ + [Fe(CN)₅NO]²⁻ → [Fe(CN)₅NOS]⁴⁻",{c:"Alkaline solution",m:[["Sulphide ion adds to the NO ligand of nitroprusside."],["A violet complex forms."]],n:"Also used in Lassaigne's test for sulphur."}],
 ["Nessler's reagent test (NH₃ / NH₄⁺)","2K₂[HgI₄] + NH₃ + 3KOH → HgO·Hg(NH₂)I↓ + 7KI + 2H₂O",{c:"Alkaline K₂[HgI₄]",m:[["[HgI₄]²⁻ is a stable tetrahedral complex of Hg²⁺."],["NH₃ replaces iodide and links two Hg atoms through NH₂ and O bridges."],["A brown precipitate (iodide of Millon's base) appears."]],n:"Very sensitive: even traces of ammonia give a yellow-brown colour."}]
]]
]
}
},
Organic:{
"Haloalkanes and Haloarenes":[
["Named reactions",[
 ["Finkelstein","R-X + NaI → R-I + NaX (dry acetone)",{c:"NaI in dry acetone; X = Cl or Br",m:[["I⁻ is a good nucleophile. It attacks the carbon from the side opposite to X (SN2)."],["The C-I bond forms as the C-X bond breaks, in a single step."],["NaCl or NaBr does not dissolve in dry acetone and precipitates. This removes a product and pulls the equilibrium forward (Le Chatelier)."]],n:"Works best with primary halides."}],
 ["Swarts","R-Br + AgF → R-F + AgBr (also Hg₂F₂, CoF₂, SbF₃)",{c:"Heat with AgF, Hg₂F₂, CoF₂ or SbF₃",m:[["The metal fluoride supplies F, which replaces Cl or Br by nucleophilic substitution."],["The metal forms a stable chloride or bromide (e.g. AgBr), which drives the exchange."]],n:"The standard way to make alkyl fluorides."}],
 ["Sandmeyer","ArN₂⁺X⁻ + CuX → Ar-X + N₂",{c:"CuCl/HCl, CuBr/HBr or CuCN/KCN",m:[["Cu(I) gives one electron to the diazonium ion. N₂ (very stable) leaves, giving an aryl radical.","ArN₂⁺ + CuX + X⁻ → Ar• + N₂ + CuX₂"],["The aryl radical takes X from the copper(II) halide, and Cu(I) is regenerated.","Ar• + CuX₂ → Ar-X + CuX"]],n:"A radical (electron-transfer) mechanism. Loss of N₂ gas drives the reaction."}],
 ["Gattermann","ArN₂⁺X⁻ + Cu/HX → Ar-X + N₂",{c:"Copper powder + HCl or HBr",m:[["Copper powder with HX does the job of the Cu(I) salt in Sandmeyer: it gives an electron to the diazonium ion."],["N₂ leaves, giving an aryl radical, which picks up X to form Ar-X."]],n:"Simpler reagent than Sandmeyer, but the yield is usually lower."}],
 ["Wurtz","2R-X + 2Na → R-R + 2NaX (dry ether)",{c:"Sodium in dry ether",m:[["Na gives one electron to R-X, forming an alkyl radical and NaX.","R-X + Na → R• + NaX"],["A second Na gives an electron to the radical, forming an alkylsodium (carbanion).","R• + Na → R⁻Na⁺"],["The carbanion attacks another R-X (SN2) and the new C-C bond forms.","R⁻Na⁺ + R-X → R-R + NaX"]],n:"Ether must be dry: water would destroy the organosodium. Two different halides give a mixture of three alkanes."}],
 ["Fittig","2Ar-X + 2Na → Ar-Ar + 2NaX",{c:"Sodium in dry ether",m:[["As in Wurtz, Na transfers electrons to Ar-X, forming an aryl radical and then arylsodium (Ar⁻Na⁺)."],["Ar⁻ attacks a second Ar-X, joining the two rings."]],n:"Example: chlorobenzene → biphenyl."}],
 ["Wurtz-Fittig","Ar-X + R-X + 2Na → Ar-R + 2NaX",{c:"Sodium in dry ether",m:[["Na transfers electrons to both halides, forming alkyl and aryl radicals / organosodium species."],["The aryl and alkyl groups couple to form a new C-C bond."]],n:"Example: C₆H₅Cl + CH₃Cl + 2Na → C₆H₅CH₃ (toluene) + 2NaCl."}],
 ["Friedel-Crafts alkylation","C₆H₆ + R-Cl → C₆H₅R + HCl (anhyd. AlCl₃)",{c:"Anhydrous AlCl₃",m:[["AlCl₃ (a Lewis acid) pulls Cl⁻ from R-Cl, giving a carbocation, the electrophile.","R-Cl + AlCl₃ → R⁺ + AlCl₄⁻"],["The π electrons of benzene attack R⁺, forming a resonance-stabilised carbocation (σ-complex)."],["AlCl₄⁻ removes H⁺ from that carbon and the ring becomes aromatic again.","H⁺ + AlCl₄⁻ → HCl + AlCl₃"]],n:"Electrophilic substitution. Limitations: carbocations can rearrange, and the product can be alkylated again."}]
]],
["Preparation",[
 ["From alcohol and HX","R-OH + HX → R-X + H₂O (ZnCl₂ for HCl)",{c:"HCl with anhydrous ZnCl₂ (Groove's process); HBr or HI directly",m:[["H⁺ protonates the -OH, turning it into a good leaving group.","R-OH + H⁺ → R-OH₂⁺"],["3° alcohols: water leaves first to give a carbocation, then X⁻ attacks it (SN1)."],["1° alcohols: X⁻ attacks the carbon as water leaves, in one step (SN2)."]],n:"ZnCl₂ helps break the C-O bond. Reactivity: 3° > 2° > 1° alcohol, and HI > HBr > HCl."}],
 ["From alcohol and SOCl₂","R-OH + SOCl₂ → R-Cl + SO₂ + HCl",{c:"Pyridine often added",m:[["The -OH oxygen attacks S of SOCl₂ and HCl is lost, giving an alkyl chlorosulphite.","R-OH + SOCl₂ → R-O-SOCl + HCl"],["Cl⁻ attacks the carbon; the -OSOCl group leaves and breaks up into SO₂ and Cl⁻."]],n:"Best method: SO₂ and HCl are gases and escape, leaving pure R-Cl."}],
 ["From alcohol and PCl₅","R-OH + PCl₅ → R-Cl + POCl₃ + HCl",{m:[["The -OH oxygen attacks phosphorus and HCl is released, giving R-O-PCl₄."],["Cl⁻ attacks the carbon and POCl₃ leaves, giving R-Cl."]],n:"PCl₃ also works: 3R-OH + PCl₃ → 3R-Cl + H₃PO₃."}],
 ["From alkane","R-H + X₂ → R-X + HX (light)",{c:"UV light or heat",m:[["Initiation: light splits X₂ into two radicals.","X₂ → 2X•"],["Propagation: X• takes an H from the alkane; R• then takes X from X₂, making a new X•.","R-H + X• → R• + HX;  R• + X₂ → R-X + X•"],["Termination: any two radicals join.","X• + X• → X₂;  R• + X• → R-X;  R• + R• → R-R"]],n:"Free-radical chain reaction. It gives a mixture of products, so it's not a good lab method."}],
 ["From alkene (Markovnikov)","CH₃CH=CH₂ + HX → CH₃CHXCH₃",{m:[["H⁺ adds to the end carbon of C=C (the one with more H), so the more stable 2° carbocation forms.","CH₃CH=CH₂ + H⁺ → CH₃C⁺HCH₃"],["X⁻ attacks the carbocation.","CH₃C⁺HCH₃ + X⁻ → CH₃CHXCH₃"]],n:"With HBr and a peroxide, addition is anti-Markovnikov (free radical) and gives 1-bromopropane."}],
 ["Halogenation of benzene","C₆H₆ + X₂ → C₆H₅X + HX (Fe or FeCl₃)",{c:"Fe or anhydrous FeCl₃, in the dark",m:[["FeCl₃ polarises Cl₂ and produces the electrophile Cl⁺.","Cl₂ + FeCl₃ → Cl⁺ + FeCl₄⁻"],["Benzene attacks Cl⁺, forming a resonance-stabilised carbocation (σ-complex)."],["FeCl₄⁻ removes H⁺ and the ring becomes aromatic again.","H⁺ + FeCl₄⁻ → HCl + FeCl₃"]],n:"Electrophilic substitution. In sunlight without a catalyst, benzene adds Cl₂ instead (gives BHC)."}]
]],
["Chemical properties",[
 ["Hydrolysis","R-X + aq. KOH → R-OH + KX",{c:"Dilute aqueous KOH or NaOH",m:[["OH⁻ is a nucleophile and replaces X."],["SN2 (1° halides): OH⁻ attacks from the side opposite to X. The C-OH bond forms as C-X breaks, in one step, with inversion of configuration.","HO⁻ + R-X → [HO···R···X]⁻ → HO-R + X⁻"],["SN1 (3° halides): X⁻ leaves first to give a planar carbocation, then OH⁻ attacks from either side. An optically active halide gives a racemic mixture."]],n:"SN2 rate: 1° > 2° > 3° (steric hindrance). SN1 rate: 3° > 2° > 1° (carbocation stability)."}],
 ["With KCN","R-X + KCN → R-CN + KX",{c:"Ethanolic KCN",m:[["KCN is ionic and gives free CN⁻ ions."],["CN⁻ is ambident. Its carbon end attacks the alkyl carbon (SN2), forming a new C-C bond."]],n:"Gives a nitrile: one carbon is added to the chain."}],
 ["With AgCN","R-X + AgCN → R-NC + AgX",{m:[["AgCN is mainly covalent, so the carbon end of CN is tied to Ag."],["The lone pair on nitrogen attacks the alkyl carbon instead, giving the isocyanide."]],n:"KCN → cyanide (R-CN); AgCN → isocyanide (R-NC)."}],
 ["With KNO₂ / AgNO₂","R-X + KNO₂ → R-O-N=O; R-X + AgNO₂ → R-NO₂",{m:[["The nitrite ion is ambident: it can attack through O or through N."],["KNO₂ is ionic, so attack through O gives an alkyl nitrite, R-O-N=O."],["AgNO₂ is covalent, with O bonded to Ag, so N attacks and gives a nitroalkane, R-NO₂."]]}],
 ["Ammonolysis","R-X + NH₃ → R-NH₂ + HX",{c:"Ethanolic NH₃, heated in a sealed tube",m:[["The lone pair on N of NH₃ attacks the carbon bearing X (SN2), forming an ammonium salt.","R-X + NH₃ → R-NH₃⁺X⁻"],["A base removes H⁺ to free the amine.","R-NH₃⁺X⁻ + NH₃ → R-NH₂ + NH₄X"],["The amine is itself a nucleophile, so it reacts with more R-X: 2° and 3° amines and the quaternary salt form too."]],n:"Excess NH₃ favours the 1° amine; excess R-X favours the quaternary salt."}],
 ["Elimination (Saytzeff)","CH₃CHBrCH₂CH₃ + alc. KOH → but-2-ene (major) + KBr + H₂O",{c:"Alcoholic KOH, heat",m:[["In alcohol, ethoxide/OH⁻ acts as a base rather than a nucleophile."],["E2: the base removes a β-hydrogen while Br⁻ leaves and the C=C forms, all in one step."],["H can come from C1 or C3. Taking it from C3 gives the more substituted, more stable alkene, but-2-ene (Saytzeff rule)."]],n:"Aqueous KOH → substitution (alcohol). Alcoholic KOH → elimination (alkene)."}],
 ["Grignard reagent","R-X + Mg → R-MgX (dry ether)",{c:"Dry ether",m:[["Mg inserts between C and X on the metal surface, by electron transfer from Mg."],["Ether molecules coordinate to Mg and stabilise the reagent."],["The C-Mg bond is very polar (Cδ⁻-Mgδ⁺), so R behaves like a carbanion."]],n:"Must be kept dry: R-MgX + H₂O → R-H + Mg(OH)X."}],
 ["Reduction","R-X + Zn/HCl → R-H",{m:[["Zn and HCl produce hydrogen in contact with the halide."],["The C-X bond is replaced by a C-H bond.","R-X + 2[H] → R-H + HX"]]}],
 ["Dow process","C₆H₅Cl + NaOH (623 K, 300 atm) → C₆H₅OH",{c:"623 K, 300 atm",m:[["Resonance gives the C-Cl bond in chlorobenzene partial double-bond character, so it is hard to break."],["High temperature and pressure force OH⁻ to replace Cl, giving sodium phenoxide.","C₆H₅Cl + 2NaOH → C₆H₅ONa + NaCl + H₂O"],["Acid releases phenol.","C₆H₅ONa + HCl → C₆H₅OH + NaCl"]],n:"-NO₂ groups at ortho/para positions make this substitution much easier."}],
 ["Nitration of chlorobenzene","Cl-C₆H₅ + HNO₃/H₂SO₄ → p-nitrochlorobenzene (major)",{c:"Conc. HNO₃ + conc. H₂SO₄",m:[["Conc. H₂SO₄ makes the nitronium ion, the electrophile.","HNO₃ + 2H₂SO₄ ⇌ NO₂⁺ + H₃O⁺ + 2HSO₄⁻"],["Cl gives lone-pair electrons to the ring by resonance (+R), raising electron density at ortho and para positions. NO₂⁺ attacks there."],["HSO₄⁻ removes H⁺ and the ring becomes aromatic again."]],n:"Cl is deactivating (-I) but ortho/para directing (+R). Para is the major product because ortho is crowded."}]
]]
],
"Alcohols, Phenols and Ethers":[
["Named reactions",[
 ["Reimer-Tiemann","C₆H₅OH + CHCl₃ + aq. NaOH, then H⁺ → salicylaldehyde",{c:"CHCl₃ + aqueous NaOH at 340 K, then dilute acid",m:[["OH⁻ removes H⁺ from CHCl₃; the anion loses Cl⁻ to give dichlorocarbene, the electrophile.","CHCl₃ + OH⁻ → ⁻CCl₃ + H₂O;  ⁻CCl₃ → :CCl₂ + Cl⁻"],["NaOH converts phenol into phenoxide ion, whose ring is very electron-rich at the ortho position."],["The ring attacks :CCl₂ at the ortho position, giving a -CHCl₂ group."],["Alkali hydrolyses -CHCl₂ to -CHO. Acid then turns the phenoxide back into -OH, giving salicylaldehyde."]],n:"Electrophilic substitution with dichlorocarbene as the electrophile."}],
 ["Kolbe","C₆H₅ONa + CO₂ (400 K, 4-7 atm), then H⁺ → salicylic acid",{c:"Sodium phenoxide + CO₂ at 400 K, 4-7 atm, then H⁺",m:[["Phenoxide ion is much more reactive towards electrophiles than phenol."],["CO₂ is a weak electrophile. The phenoxide ring attacks its carbon at the ortho position."],["A proton shift restores the aromatic ring, giving sodium salicylate."],["Acid converts sodium salicylate to salicylic acid."]],n:"Salicylic acid is used to make aspirin."}],
 ["Williamson synthesis","R-ONa + R′-X → R-O-R′ + NaX",{m:[["The alkoxide ion, RO⁻, is a strong nucleophile."],["It attacks the carbon of R′-X from the back side and X⁻ leaves (SN2).","RO⁻ + R′-X → R-O-R′ + X⁻"]],n:"R′-X should be primary. With a 3° halide, the alkoxide acts as a base and gives an alkene instead."}],
 ["Hydroboration-oxidation","CH₃CH=CH₂ → B₂H₆, then H₂O₂/OH⁻ → CH₃CH₂CH₂OH",{c:"B₂H₆ in THF, then H₂O₂ / NaOH",m:[["BH₃ adds across C=C: B goes to the less substituted carbon, H to the more substituted one.","CH₃CH=CH₂ + BH₃ → CH₃CH₂CH₂-BH₂"],["This repeats twice more, giving trialkylborane, (CH₃CH₂CH₂)₃B."],["H₂O₂/OH⁻ replaces each C-B bond with C-OH.","(CH₃CH₂CH₂)₃B + 3H₂O₂ → 3CH₃CH₂CH₂OH + B(OH)₃"]],n:"Overall anti-Markovnikov addition of water: propene gives the 1° alcohol."}],
 ["Cumene process","Cumene + O₂ → hydroperoxide; with H⁺/H₂O → phenol + acetone",{m:[["Air oxidises cumene at the benzylic carbon (a radical reaction), giving cumene hydroperoxide.","C₆H₅CH(CH₃)₂ + O₂ → C₆H₅C(CH₃)₂-O-OH"],["Acid protonates the -O-OH group. Water leaves and the phenyl group shifts from C to O."],["The carbocation formed adds water and splits into phenol and acetone."]],n:"Industrial method; acetone is a valuable by-product."}],
 ["Lucas test","ROH + HCl/ZnCl₂ → R-Cl (turbidity: 3° at once, 2° in 5 min, 1° none)",{c:"Conc. HCl + anhydrous ZnCl₂ (Lucas reagent), room temperature",m:[["ZnCl₂ (a Lewis acid) helps the -OH leave, forming a carbocation (SN1)."],["3° carbocations form fastest, 2° slower, 1° hardly at all."],["Cl⁻ attacks the carbocation, giving R-Cl, which is insoluble and makes the solution cloudy."]],n:"The time taken for cloudiness tells 1°, 2° and 3° alcohols apart."}]
]],
["Preparation of alcohols",[
 ["Hydration of alkene","CH₃CH=CH₂ + H₂O → CH₃CH(OH)CH₃ (H⁺)",{c:"Dilute H₂SO₄ catalyst",m:[["H⁺ adds to the alkene, giving the more stable carbocation (Markovnikov).","CH₃CH=CH₂ + H₃O⁺ → CH₃C⁺HCH₃ + H₂O"],["Water attacks the carbocation.","CH₃C⁺HCH₃ + H₂O → CH₃CH(OH₂⁺)CH₃"],["Loss of H⁺ gives the alcohol and regenerates the catalyst.","CH₃CH(OH₂⁺)CH₃ + H₂O → CH₃CH(OH)CH₃ + H₃O⁺"]]}],
 ["Reduction of aldehyde","RCHO + H₂ → RCH₂OH (Ni, or NaBH₄)",{m:[["NaBH₄ delivers a hydride ion (H⁻) to the carbonyl carbon (nucleophilic addition).","RCHO + H⁻ → RCH₂O⁻"],["The alkoxide picks up H⁺ to give the alcohol.","RCH₂O⁻ + H⁺ → RCH₂OH"]],n:"Aldehydes give 1° alcohols; ketones give 2° alcohols. With H₂/Ni, H₂ adds across C=O on the metal surface."}],
 ["Reduction of acid","RCOOH + LiAlH₄ → RCH₂OH",{c:"LiAlH₄ in dry ether, then H₂O",m:[["LiAlH₄ supplies hydride ions (H⁻)."],["The acid is reduced through an aldehyde stage to an alkoxide."],["Water work-up gives the 1° alcohol, RCH₂OH."]],n:"LiAlH₄ is costly, so industry first makes the ester and reduces that with H₂ and a catalyst."}],
 ["Grignard with HCHO","RMgX + HCHO, then H₃O⁺ → RCH₂OH (1°)",{c:"Dry ether, then dilute acid",m:[["The C-Mg bond is very polar, so R of RMgX acts as a carbanion and attacks the carbonyl carbon (nucleophilic addition).","C=O + RMgX → R-C-OMgX"],["The magnesium alkoxide adduct is hydrolysed by dilute acid.","R-C-OMgX + H₂O → RCH₂OH + Mg(OH)X"]],n:"HCHO gives 1°, other aldehydes give 2°, ketones give 3° alcohols. This one gives a 1° alcohol."}],
 ["Grignard with aldehyde","RMgX + R′CHO, then H₃O⁺ → RR′CHOH (2°)",{c:"Dry ether, then dilute acid",m:[["The C-Mg bond is very polar, so R of RMgX acts as a carbanion and attacks the carbonyl carbon (nucleophilic addition).","C=O + RMgX → R-C-OMgX"],["The magnesium alkoxide adduct is hydrolysed by dilute acid.","R-C-OMgX + H₂O → RR′CHOH + Mg(OH)X"]],n:"HCHO gives 1°, other aldehydes give 2°, ketones give 3° alcohols. This one gives a 2° alcohol."}],
 ["Grignard with ketone","RMgX + R′₂C=O, then H₃O⁺ → RR′₂COH (3°)",{c:"Dry ether, then dilute acid",m:[["The C-Mg bond is very polar, so R of RMgX acts as a carbanion and attacks the carbonyl carbon (nucleophilic addition).","C=O + RMgX → R-C-OMgX"],["The magnesium alkoxide adduct is hydrolysed by dilute acid.","R-C-OMgX + H₂O → RR′₂COH + Mg(OH)X"]],n:"HCHO gives 1°, other aldehydes give 2°, ketones give 3° alcohols. This one gives a 3° alcohol."}]
]],
["Preparation of phenol and ethers",[
 ["From diazonium salt","C₆H₅N₂⁺Cl⁻ + H₂O (warm) → C₆H₅OH + N₂ + HCl",{c:"Warm the aqueous diazonium salt solution",m:[["On warming, N₂ (a very stable gas) leaves from the ring."],["Water attacks the ring carbon and H⁺ is lost, giving phenol."]]}],
 ["From sulphonic acid","C₆H₅SO₃Na + NaOH (fuse), then H⁺ → C₆H₅OH",{c:"Fuse with NaOH, then acidify",m:[["OH⁻ replaces the -SO₃⁻ group, giving sodium phenoxide.","C₆H₅SO₃Na + 2NaOH → C₆H₅ONa + Na₂SO₃ + H₂O"],["Acid converts sodium phenoxide into phenol."]]}],
 ["Ether from alcohol (413 K)","2R-OH → R-O-R + H₂O (conc. H₂SO₄)",{m:[["H⁺ protonates one alcohol molecule.","R-OH + H⁺ → R-OH₂⁺"],["A second alcohol molecule attacks the carbon and pushes out water (SN2).","R-OH + R-OH₂⁺ → R-O⁺(H)-R + H₂O"],["Loss of H⁺ gives the ether.","R-O⁺(H)-R → R-O-R + H⁺"]],n:"At 443 K the same mixture gives ethene instead. Works only for 1° alcohols."}]
]],
["Properties of alcohols",[
 ["With sodium","2R-OH + 2Na → 2R-ONa + H₂",{m:[["The O-H bond is polar, so the alcohol acts as a weak acid."],["Na gives an electron; H₂ is released and the alkoxide forms."]],n:"Acid strength: 1° > 2° > 3° (alkyl groups push electrons towards O)."}],
 ["Dehydration (443 K)","C₂H₅OH → CH₂=CH₂ + H₂O (conc. H₂SO₄)",{c:"Conc. H₂SO₄ at 443 K",m:[["The -OH is protonated.","CH₃CH₂-OH + H⁺ → CH₃CH₂-OH₂⁺"],["Water leaves, giving a carbocation (slow step).","CH₃CH₂-OH₂⁺ → CH₃CH₂⁺ + H₂O"],["H⁺ is lost from the neighbouring carbon, forming the C=C.","CH₃CH₂⁺ → CH₂=CH₂ + H⁺"]],n:"Ease of dehydration: 3° > 2° > 1°."}],
 ["Oxidation of 1°","RCH₂OH → RCHO (PCC) → RCOOH (KMnO₄)",{m:[["Oxidation removes the H of O-H and an H from the carbinol carbon, forming C=O."],["PCC works without water, so it stops at the aldehyde."],["Aqueous KMnO₄ goes further: the aldehyde is oxidised to a carboxylic acid."]]}],
 ["Oxidation of 2°","R₂CHOH → R₂C=O (CrO₃)",{m:[["CrO₃ forms a chromate ester with the -OH."],["The H on the carbinol carbon is removed as Cr is reduced, forming C=O."]],n:"3° alcohols have no H on the carbinol carbon, so they resist oxidation."}],
 ["Esterification","R-OH + R′COOH ⇌ R′COOR + H₂O (H⁺)",{c:"Conc. H₂SO₄ catalyst, heat",m:[["H⁺ protonates the C=O oxygen of the acid, making the carbonyl carbon more electrophilic."],["The alcohol oxygen attacks this carbon, giving a tetrahedral intermediate."],["A proton moves to one -OH, which leaves as water."],["Loss of H⁺ gives the ester and regenerates the acid catalyst."]],n:"Reversible. Removing water or using excess alcohol pushes it forward. ¹⁸O labelling shows the water's oxygen comes from the acid."}],
 ["Dehydrogenation (Cu, 573 K)","1° → aldehyde, 2° → ketone, 3° → alkene",{m:[["Hot copper removes two H atoms, one from O-H and one from the carbinol C-H, forming C=O.","RCH₂OH → RCHO + H₂"],["3° alcohols have no C-H on the carbinol carbon, so they lose water instead and give alkenes."]],n:"A quick way to tell 1°, 2° and 3° alcohols apart."}]
]],
["Properties of phenol and ethers",[
 ["With NaOH","C₆H₅OH + NaOH → C₆H₅ONa + H₂O",{m:[["Phenol gives up H⁺ to OH⁻."],["Phenoxide ion is stabilised by resonance: the negative charge spreads over the ring."]],n:"Alcohols don't react with NaOH, but phenol does. Phenol is weaker than carboxylic acids, so it doesn't react with NaHCO₃."}],
 ["Bromine water","C₆H₅OH + 3Br₂ → 2,4,6-tribromophenol↓ + 3HBr",{m:[["-OH strongly activates the ring (+R). In water, phenol partly ionises to the even more reactive phenoxide."],["The ring polarises Br₂ itself, so no Lewis acid is needed. Br⁺ attacks the ortho and para positions."],["All three ortho/para positions are substituted, giving a white precipitate."]],n:"In CS₂ or CHCl₃ at low temperature, monobromophenols (mainly para) form instead."}],
 ["Nitration (conc.)","C₆H₅OH + conc. HNO₃ → 2,4,6-trinitrophenol (picric acid)",{m:[["Conc. HNO₃ supplies NO₂⁺."],["The strongly activated ring is nitrated at all ortho and para positions."]],n:"Dilute HNO₃ at 298 K gives o- and p-nitrophenol. They are separated by steam distillation: ortho is steam volatile because of intramolecular H-bonding."}],
 ["Reduction","C₆H₅OH + Zn → C₆H₆ + ZnO",{c:"Heat with zinc dust",m:[["Zn removes the oxygen atom from phenol and becomes ZnO."]]}],
 ["Oxidation","Phenol + Na₂Cr₂O₇/H⁺ → benzoquinone",{m:[["Chromic acid oxidises the ring: the -OH and the para C-H both become C=O."],["The product is benzoquinone, a conjugated diketone."]]}],
 ["FeCl₃ test","Phenol + FeCl₃ → violet colour",{c:"Neutral FeCl₃ solution",m:[["Phenoxide groups bind to Fe³⁺, forming a coloured complex.","6C₆H₅OH + Fe³⁺ → [Fe(OC₆H₅)₆]³⁻ + 6H⁺"]],n:"Violet colour: test for phenols (enols also respond)."}],
 ["Ether cleavage","R-O-R′ + HI → R-OH + R′-I",{c:"Conc. HI, heat",m:[["H⁺ protonates the ether oxygen, making a good leaving group.","R-O-R′ + HI → R-O⁺(H)-R′ + I⁻"],["If both groups are 1° or 2°, I⁻ attacks the smaller (less hindered) group by SN2."],["If one group is 3°, it leaves as a carbocation (SN1) and gives the tertiary iodide."]],n:"Anisole + HI gives phenol + CH₃I: the O-aryl bond doesn't break because of its partial double-bond character."}],
 ["Anisole nitration or bromination","Gives o- and p- products (main: para)",{m:[["-OCH₃ gives electrons to the ring by resonance (+R), raising electron density at ortho and para positions."],["The electrophile attacks these positions. Para is major because ortho is crowded."]],n:"Bromination works even without FeBr₃, in ethanoic acid."}]
]]
],
"Aldehydes, Ketones and Carboxylic Acids":[
["Named reactions",[
 ["Rosenmund","RCOCl + H₂ → RCHO + HCl (Pd/BaSO₄)",{c:"H₂ over Pd on BaSO₄",m:[["H₂ is adsorbed on Pd. The C-Cl bond of the acid chloride is split and replaced by C-H (hydrogenolysis)."],["BaSO₄ 'poisons' the Pd, lowering its activity so the aldehyde is not reduced further to an alcohol."]],n:"Poisoned catalyst = partly deactivated catalyst."}],
 ["Stephen","RCN + SnCl₂ + HCl → RCH=NH; H₃O⁺ → RCHO",{c:"SnCl₂ + HCl in ether, then H₃O⁺",m:[["SnCl₂/HCl reduces the nitrile to an imine (as its salt).","RC≡N → RCH=NH"],["Water hydrolyses the imine to the aldehyde.","RCH=NH + H₂O → RCHO + NH₃"]]}],
 ["Etard","Toluene + CrO₂Cl₂ (CS₂), then H₃O⁺ → benzaldehyde",{c:"CrO₂Cl₂ in CS₂, then H₃O⁺",m:[["Chromyl chloride oxidises the -CH₃ group and forms a brown chromium complex (the Etard complex)."],["Acid hydrolysis of the complex gives benzaldehyde. Oxidation stops at the aldehyde stage."]]}],
 ["Gattermann-Koch","C₆H₆ + CO + HCl → C₆H₅CHO (AlCl₃/CuCl)",{c:"CO + HCl, anhydrous AlCl₃ / CuCl, high pressure",m:[["CO and HCl, with AlCl₃, form the formyl cation, the electrophile.","CO + HCl + AlCl₃ → HC⁺=O + AlCl₄⁻"],["Benzene attacks the formyl cation. Loss of H⁺ restores the ring, giving benzaldehyde."]],n:"Formyl chloride is unstable, so this electrophile is made in the flask."}],
 ["Friedel-Crafts acylation","C₆H₆ + RCOCl → C₆H₅COR + HCl (AlCl₃)",{c:"Anhydrous AlCl₃",m:[["AlCl₃ takes Cl⁻ from RCOCl, giving the acylium ion.","RCOCl + AlCl₃ → RC≡O⁺ + AlCl₄⁻"],["Benzene attacks the acylium ion, forming a σ-complex."],["AlCl₄⁻ removes H⁺; the ring becomes aromatic again, and HCl and AlCl₃ form."]],n:"The ketone formed is less reactive than benzene, so only one acyl group adds."}],
 ["Aldol condensation","2CH₃CHO → CH₃CH(OH)CH₂CHO (dil. NaOH); heat → CH₃CH=CHCHO",{c:"Dilute NaOH; heat for the condensation step",m:[["OH⁻ removes an α-hydrogen, forming an enolate (carbanion).","CH₃CHO + OH⁻ → ⁻CH₂CHO + H₂O"],["The enolate attacks the C=O carbon of a second ethanal molecule.","⁻CH₂CHO + CH₃CHO → CH₃CH(O⁻)CH₂CHO"],["The alkoxide takes H⁺ from water, giving the aldol (3-hydroxybutanal).","CH₃CH(O⁻)CH₂CHO + H₂O → CH₃CH(OH)CH₂CHO + OH⁻"],["On heating, water is lost, giving but-2-enal (an α,β-unsaturated aldehyde)."]],n:"Needs at least one α-hydrogen. Two different carbonyls (cross aldol) give a mixture."}],
 ["Cannizzaro","2HCHO + conc. KOH → CH₃OH + HCOOK",{c:"Concentrated KOH or NaOH",m:[["OH⁻ adds to the C=O carbon of one HCHO molecule.","HCHO + OH⁻ → H₂C(OH)O⁻"],["This intermediate transfers a hydride ion (H⁻) to a second HCHO molecule."],["The first becomes formate (oxidised). The second becomes methoxide, which takes H⁺ to give methanol (reduced)."]],n:"Only for aldehydes with no α-hydrogen. It is a disproportionation."}],
 ["Clemmensen","C=O + Zn-Hg/conc. HCl → CH₂",{c:"Zinc amalgam + conc. HCl",m:[["The Zn-Hg surface gives electrons and HCl gives protons."],["The C=O oxygen is removed as water and replaced by two H atoms, step by step on the zinc surface."]],n:"Acidic conditions. For acid-sensitive compounds, use Wolff-Kishner instead."}],
 ["Wolff-Kishner","C=O + NH₂NH₂, then KOH/ethylene glycol, heat → CH₂ + N₂",{c:"NH₂NH₂, then KOH in ethylene glycol, heat",m:[["Hydrazine reacts with C=O to form a hydrazone.","R₂C=O + NH₂NH₂ → R₂C=N-NH₂ + H₂O"],["Strong base removes H from N; the double bond shifts and the carbon is protonated."],["N₂ gas is released, leaving a carbanion that is protonated to CH₂.","R₂C=N-NH₂ → R₂CH₂ + N₂"]],n:"Basic conditions: good for acid-sensitive compounds."}],
 ["Haloform (iodoform)","CH₃COR + 3I₂ + 4NaOH → CHI₃↓ + RCOONa + 3NaI + 3H₂O",{c:"I₂ + NaOH (or NaOI)",m:[["OH⁻ removes an α-H from the CH₃ group; the enolate takes an I from I₂. This happens three times.","CH₃COR → CI₃COR"],["OH⁻ attacks the C=O carbon of CI₃COR."],["CI₃⁻ is a good leaving group and breaks away, then takes H⁺ to form iodoform.","CI₃COR + OH⁻ → RCOO⁻ + CHI₃"]],n:"Yellow CHI₃ precipitate: test for CH₃CO- groups, and for CH₃CH(OH)- groups (oxidised first)."}],
 ["Hell-Volhard-Zelinsky","RCH₂COOH + X₂/red P → RCHXCOOH",{c:"Cl₂ or Br₂ with red phosphorus, then H₂O",m:[["Red P and X₂ form PX₃, which turns some acid into the acyl halide.","RCH₂COOH → RCH₂COX"],["The acyl halide forms an enol far more easily than the acid."],["The enol reacts with X₂ at the α-carbon.","RCH=C(OH)X + X₂ → RCHXCOX + HX"],["Water (or more acid) converts it into the α-halo acid."]],n:"Only acids with an α-hydrogen react."}],
 ["Tollens' test","RCHO + 2[Ag(NH₃)₂]⁺ + 3OH⁻ → RCOO⁻ + 2Ag↓ + 4NH₃ + 2H₂O",{c:"Ammoniacal silver nitrate, warm",m:[["The aldehyde is oxidised to a carboxylate ion.","RCHO + 3OH⁻ → RCOO⁻ + 2H₂O + 2e⁻"],["Each Ag⁺ in the complex gains one electron and deposits as a silver mirror.","[Ag(NH₃)₂]⁺ + e⁻ → Ag + 2NH₃"]],n:"Ketones do not respond (α-hydroxy ketones are an exception)."}],
 ["Fehling's test","RCHO + 2Cu²⁺ + 5OH⁻ → RCOO⁻ + Cu₂O↓ + 3H₂O",{c:"Fehling's A (CuSO₄) + Fehling's B (alkaline sodium potassium tartrate), heat",m:[["Cu²⁺ is held as a tartrate complex in alkali."],["The aldehyde is oxidised to carboxylate.","RCHO + 3OH⁻ → RCOO⁻ + 2H₂O + 2e⁻"],["Cu²⁺ is reduced to Cu⁺, which precipitates as red-brown Cu₂O.","2Cu²⁺ + 2OH⁻ + 2e⁻ → Cu₂O + H₂O"]],n:"Aromatic aldehydes such as benzaldehyde do not give this test."}]
]],
["Preparation of aldehydes and ketones",[
 ["Oxidation of 1° alcohol","RCH₂OH → RCHO (PCC)",{c:"PCC in CH₂Cl₂",m:[["PCC (pyridinium chlorochromate) forms a chromate ester with the alcohol."],["A base removes the C-H, forming C=O as Cr(VI) is reduced."],["No water is present, so the aldehyde is not oxidised further to an acid."]]}],
 ["Oxidation of 2° alcohol","R₂CHOH → R₂C=O",{c:"K₂Cr₂O₇/H⁺ or CrO₃",m:[["H is removed from O-H and from the C-H of the carbinol carbon, forming C=O."],["The ketone has no H on its carbonyl carbon, so it resists further oxidation."]]}],
 ["Hydration of alkyne","HC≡CH + H₂O → CH₃CHO (HgSO₄/H₂SO₄)",{c:"HgSO₄ + dilute H₂SO₄, 333 K",m:[["Hg²⁺ activates the triple bond. Water adds (Markovnikov), giving an enol.","HC≡CH + H₂O → CH₂=CH-OH"],["The enol is unstable and tautomerises to the carbonyl compound.","CH₂=CH-OH → CH₃CHO"]],n:"Ethyne gives ethanal; all other alkynes give ketones."}],
 ["Ketone from nitrile","RCN + R′MgX, then H₃O⁺ → RCOR′",{c:"Dry ether, then H₃O⁺",m:[["R′ of the Grignard reagent attacks the nitrile carbon (nucleophilic addition).","RC≡N + R′MgX → RR′C=N-MgX"],["Acid hydrolysis converts the imine salt into the ketone.","RR′C=NMgX + 2H₂O → RCOR′ + NH₃ + Mg(OH)X"]]}],
 ["Ketone from acid chloride","2RCOCl + R′₂Cd → 2RCOR′ + CdCl₂",{m:[["R′ of R′₂Cd attacks the carbonyl carbon of the acid chloride and Cl⁻ leaves (nucleophilic acyl substitution)."],["Dialkylcadmium is less reactive than a Grignard reagent, so it does not attack the ketone formed."]],n:"A Grignard reagent would react again and give a 3° alcohol."}],
 ["Ozonolysis","Alkene + O₃, then Zn/H₂O → aldehydes and ketones",{c:"O₃, then Zn dust + H₂O",m:[["O₃ adds across the C=C, forming an unstable molozonide."],["This rearranges to an ozonide."],["Zn/H₂O splits the ozonide into two carbonyl compounds. Zn destroys H₂O₂ so the aldehydes are not oxidised."]],n:"Used to find the position of the C=C in an alkene."}]
]],
["Preparation of carboxylic acids",[
 ["Oxidation of 1° alcohol","RCH₂OH → RCOOH (KMnO₄)",{c:"Alkaline KMnO₄, then acidify",m:[["The alcohol is first oxidised to the aldehyde."],["In water, the aldehyde is oxidised further to the carboxylic acid."]]}],
 ["Hydrolysis of nitrile","RCN + 2H₂O → RCOOH + NH₃ (H⁺)",{c:"Dilute acid (or base), heat",m:[["H⁺ protonates nitrogen and water attacks the carbon, giving an amide.","RC≡N + H₂O → RCONH₂"],["Further hydrolysis of the amide gives the acid.","RCONH₂ + H₂O + H⁺ → RCOOH + NH₄⁺"]],n:"Under mild conditions the reaction stops at the amide."}],
 ["Grignard with CO₂","RMgX + CO₂, then H₃O⁺ → RCOOH",{c:"Dry ice in dry ether, then H₃O⁺",m:[["R of RMgX attacks the carbon of CO₂.","RMgX + CO₂ → RCOOMgX"],["Acid hydrolysis gives the carboxylic acid.","RCOOMgX + H₂O → RCOOH + Mg(OH)X"]],n:"Adds one carbon to the chain."}],
 ["Alkylbenzene oxidation","C₆H₅-R → C₆H₅COOH (KMnO₄/KOH)",{c:"Alkaline KMnO₄, heat, then acidify",m:[["KMnO₄ attacks the benzylic C-H (the carbon next to the ring)."],["The whole side chain, however long, is oxidised down to -COOH (-COOK in alkali)."],["Acidifying gives benzoic acid."]],n:"Needs at least one benzylic H: tert-butylbenzene is not oxidised."}],
 ["Ester hydrolysis","RCOOR′ + H₂O → RCOOH + R′OH",{c:"Aqueous NaOH (saponification), then acid; or dilute acid",m:[["In base, OH⁻ attacks the C=O carbon, giving a tetrahedral intermediate."],["R′O⁻ leaves. The acid formed gives its H⁺ to R′O⁻, leaving the carboxylate."],["Acidifying gives the free carboxylic acid."]],n:"Base hydrolysis is irreversible. Acid hydrolysis is the reverse of esterification."}]
]],
["Properties of aldehydes and ketones",[
 ["With HCN","C=O + HCN → cyanohydrin",{c:"Trace of base",m:[["Base makes cyanide ions from HCN.","HCN + OH⁻ → CN⁻ + H₂O"],["CN⁻ attacks the carbonyl carbon (nucleophilic addition), giving an alkoxide. Carbon changes from sp² (planar) to sp³ (tetrahedral)."],["The alkoxide takes H⁺, giving the cyanohydrin."]],n:"Aldehydes react faster than ketones (less crowding, less +I effect)."}],
 ["With NaHSO₃","C=O + NaHSO₃ → bisulphite adduct",{m:[["The S of the bisulphite ion attacks the carbonyl carbon."],["A proton transfer gives the crystalline addition product."]],n:"Reversible: dilute acid or alkali gives the carbonyl back. Used to separate and purify aldehydes."}],
 ["With alcohol (dry HCl)","RCHO + 2R′OH → acetal + H₂O",{m:[["Dry HCl protonates C=O; one alcohol molecule adds, giving a hemiacetal.","RCHO + R′OH → RCH(OH)OR′"],["The -OH of the hemiacetal is protonated and leaves as water, giving a carbocation stabilised by -OR′."],["A second alcohol attacks it; loss of H⁺ gives the acetal, RCH(OR′)₂."]],n:"Ketones with ethylene glycol give ketals, used to protect the C=O group."}],
 ["With NH₂OH","C=O + NH₂OH → oxime",{c:"Weakly acidic medium (pH ≈ 3.5)",m:[["The lone pair on N of hydroxylamine attacks the carbonyl carbon (nucleophilic addition)."],["A proton transfer gives an unstable carbinolamine, C(OH)-NH-Z."],["Water is lost (elimination), forming the C=N bond of the oxime.","C(OH)-NH-Z → C=N-Z + H₂O"]],n:"Product: oxime (C=N-OH)."}],
 ["With NH₂NH₂","C=O + NH₂NH₂ → hydrazone",{c:"Weakly acidic medium (pH ≈ 3.5)",m:[["The lone pair on N of hydrazine attacks the carbonyl carbon (nucleophilic addition)."],["A proton transfer gives an unstable carbinolamine, C(OH)-NH-Z."],["Water is lost (elimination), forming the C=N bond of the hydrazone.","C(OH)-NH-Z → C=N-Z + H₂O"]],n:"Product: hydrazone (C=N-NH₂)."}],
 ["With 2,4-DNP","C=O + 2,4-DNP → orange-red 2,4-DNP derivative",{c:"Weakly acidic medium (pH ≈ 3.5)",m:[["The lone pair on N of 2,4-dinitrophenylhydrazine attacks the carbonyl carbon (nucleophilic addition)."],["A proton transfer gives an unstable carbinolamine, C(OH)-NH-Z."],["Water is lost (elimination), forming the C=N bond of the 2,4-DNP derivative.","C(OH)-NH-Z → C=N-Z + H₂O"]],n:"Orange-red precipitate: a test for the C=O group."}],
 ["Reduction","C=O + NaBH₄ or H₂/Ni → alcohol",{m:[["NaBH₄ (or LiAlH₄) gives a hydride ion (H⁻) to the carbonyl carbon."],["The alkoxide formed takes H⁺ from water or acid, giving the alcohol."]],n:"Aldehydes give 1° alcohols; ketones give 2° alcohols."}]
]],
["Properties of carboxylic acids",[
 ["With NaHCO₃","RCOOH + NaHCO₃ → RCOONa + H₂O + CO₂",{m:[["The acid gives H⁺ to HCO₃⁻, forming carbonic acid.","RCOOH + HCO₃⁻ → RCOO⁻ + H₂CO₃"],["Carbonic acid breaks down into water and CO₂ (brisk effervescence).","H₂CO₃ → H₂O + CO₂"]],n:"Carboxylic acids are stronger than carbonic acid; phenols are not, so they don't react. The carboxylate ion has two equal resonance structures."}],
 ["With SOCl₂","RCOOH + SOCl₂ → RCOCl + SO₂ + HCl",{m:[["The acid's -OH attacks S. HCl is lost, giving an acyl chlorosulphite."],["Cl⁻ attacks the carbonyl carbon. The leaving group breaks up into SO₂ and Cl⁻."]],n:"SO₂ and HCl are gases, so the acid chloride is easy to purify."}],
 ["Esterification","RCOOH + R′OH ⇌ RCOOR′ + H₂O (H⁺)",{c:"Conc. H₂SO₄ catalyst, heat",m:[["H⁺ protonates the C=O oxygen of the acid, making the carbonyl carbon more electrophilic."],["The alcohol oxygen attacks this carbon, giving a tetrahedral intermediate."],["A proton moves to one -OH, which leaves as water."],["Loss of H⁺ gives the ester and regenerates the acid catalyst."]],n:"Reversible. Removing water or using excess alcohol pushes it forward. ¹⁸O labelling shows the water's oxygen comes from the acid."}],
 ["Amide formation","RCOOH + NH₃ → RCOONH₄ → RCONH₂ (heat)",{m:[["Acid-base step: NH₃ takes H⁺, forming ammonium carboxylate.","RCOOH + NH₃ → RCOO⁻NH₄⁺"],["On strong heating, water is lost and the amide forms.","RCOONH₄ → RCONH₂ + H₂O"]]}],
 ["Reduction","RCOOH + LiAlH₄ → RCH₂OH",{c:"LiAlH₄, then H₂O (B₂H₆ also works)",m:[["Hydride ions from LiAlH₄ attack the carbonyl carbon."],["The acid is reduced through an aldehyde stage to an alkoxide. Water work-up gives the 1° alcohol."]],n:"NaBH₄ cannot reduce -COOH."}],
 ["Decarboxylation","RCOONa + NaOH → R-H + Na₂CO₃ (soda lime, heat)",{c:"Soda lime (NaOH + CaO), heat",m:[["On heating, the C-COO⁻ bond breaks and the CO₂ leaves as carbonate."],["The R group picks up H, giving an alkane with one carbon fewer."]],n:"Kolbe electrolysis is another decarboxylation: 2RCOO⁻ → R-R + 2CO₂ + 2e⁻."}],
 ["Benzoic acid nitration","C₆H₅COOH + HNO₃/H₂SO₄ → m-nitrobenzoic acid",{c:"Conc. HNO₃ + conc. H₂SO₄",m:[["Conc. H₂SO₄ makes the nitronium ion, the electrophile.","HNO₃ + 2H₂SO₄ ⇌ NO₂⁺ + H₃O⁺ + 2HSO₄⁻"],["-COOH pulls electrons from the ring (-I and -R), lowering electron density most at ortho and para positions."],["So NO₂⁺ attacks the meta position, which is the least deactivated."]],n:"-COOH is deactivating and meta-directing. Benzoic acid doesn't undergo Friedel-Crafts: AlCl₃ binds to the -COOH."}]
]]
],
"Amines":[
["Named reactions",[
 ["Gabriel phthalimide","Phthalimide + KOH → K-salt; + R-X → N-alkyl; NaOH(aq) → R-NH₂",{m:[["KOH removes the N-H proton of phthalimide (made acidic by the two C=O groups), giving potassium phthalimide."],["The phthalimide anion attacks R-X (SN2), giving N-alkylphthalimide."],["Hydrolysis with aqueous NaOH frees the primary amine."]],n:"Gives pure 1° amines only. Aromatic amines can't be made: aryl halides don't do SN2."}],

const RX_TABS = {
  Organic:[["named","Named reactions"],["normal","Preparation and properties"]],
  Inorganic:[["prep","Preparation"],["prop","Chemical properties"],["named","Named reactions"]]
};
function rxPartOf(t){ const tabs=RX_TABS[t]; if(!tabs) return null; return tabs.some(([k])=>k===state.rxPart)?state.rxPart:tabs[0][0]; }
function rxSections(t,ch,part){
  const d=REACTIONS[t][ch]; if(!d) return [];
  if(t==="Inorganic") return d[part]||[];
  if(t==="Organic") return d.filter(([n])=>(n==="Named reactions")===(part==="named"));
  return d;
}
function rxCount(secs){ return secs.reduce((a,[,rs])=>a+rs.length,0); }
function rxChapterCount(t,ch){ const d=REACTIONS[t][ch]; return t==="Inorganic"?Object.values(d).reduce((a,s)=>a+rxCount(s),0):rxCount(d); }
// Flat list of reactions in the current chapter + tab (drives the modal and its prev/next).
function rxList(){
  const t=state.rxType||"Organic", ch=state.rxCh, part=rxPartOf(t), out=[];
  if(!ch) return out;
  rxSections(t,ch,part).forEach(([sec,rs])=>rs.forEach(([name,eq,x])=>out.push({sec,name,eq,x:x||{}})));
  return out;
}

function renderReactions(){
  const t=state.rxType||"Organic", ch=state.rxCh, part=rxPartOf(t), data=REACTIONS[t];
  const chips=["Organic","Inorganic","Physical"].map(x=>`<button onclick="state.rxType='${x}';state.rxCh=null;state.rxPart=null;render()" class="chip ${x===t?'active':''}">${x}</button>`).join("");
  let body;
  if(ch){
    const secs=rxSections(t,ch,part); let idx=0;
    const tabs=RX_TABS[t]?`<div class="flex gap-2 mb-4" style="flex-wrap:wrap">${RX_TABS[t].map(([k,l])=>`<button onclick="state.rxPart='${k}';render()" class="chip ${part===k?'active':''}">${l} <span style="opacity:.7">${rxCount(rxSections(t,ch,k))}</span></button>`).join("")}</div>`:"";
    body=`<button onclick="state.rxCh=null;render()" class="btn btn-ghost mb-4">← Chapters</button><h2 class="text-xl font-bold mb-3">${escapeHtml(ch)}</h2>${tabs}`
      +(secs.length?secs.map(([n,rs],si)=>`<h3 class="rxsec">${escapeHtml(n)}</h3><div class="card p-2${si>0?' rv':''}">${rs.map(([a,,x])=>{const i=idx++;
        return `<button class="rxrow" onclick="openRx(${i})"><span class="nm">${escapeHtml(a)}</span>${x&&x.m?'<span class="mk">Mechanism</span>':''}<span class="cv" aria-hidden="true">›</span></button>`;}).join("")}</div>`).join("")
        :`<div class="card p-4 text-sm" style="color:var(--muted)">No reactions in this part yet.</div>`);
  } else body=`<div class="grid gap-3">${Object.keys(data).map((c,i)=>{const n=rxChapterCount(t,c);
    return `<button onclick="state.rxCh=decodeURIComponent('${encodeURIComponent(c)}');render()" class="card p-4 text-left scard${i>5?' rv':''}" style="--sc:var(--che)"><span class="snum">${String(i+1).padStart(2,"0")}</span><span class="smid"><span class="font-semibold">${escapeHtml(c)}</span><span class="text-xs" style="color:var(--muted)">${n} reactions${t==="Inorganic"?' · preparation, properties, named reactions':''}</span></span><span class="cv" aria-hidden="true">›</span></button>`;}).join("")}</div>`;
  return `${header("reactions")}${studyTabs("reactions")}<div class="sh-title mb-1"><span class="ic" aria-hidden="true">⚗️</span><h2 class="text-2xl font-bold">Chemistry Reactions</h2></div><p class="mb-4 text-sm" style="color:var(--muted)">Chapter-wise reactions in three parts: Organic, Inorganic and Physical. Tap any reaction to open it. Inorganic chapters are split into preparation, chemical properties and named reactions, with step-by-step mechanisms.</p><div class="flex gap-2 mb-4">${chips}</div>${body}`;
}

// ---------- Reaction detail modal ----------
const rxm={el:null,pushed:false,last:null,timer:0,ty:null};
function rxEl(){
  if(rxm.el) return rxm.el;
  const m=document.createElement("div"); m.id="rxm"; m.hidden=true;
  m.innerHTML=`<div class="scrim" onclick="closeRx()"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rxTitle"></div>`;
  document.body.appendChild(m);
  m.addEventListener("keydown",e=>{
    if(e.key==="Escape"){ e.preventDefault(); closeRx(); }
    else if(e.key==="ArrowLeft"&&!/INPUT|TEXTAREA/.test(e.target.tagName)) stepRx(-1);
    else if(e.key==="ArrowRight"&&!/INPUT|TEXTAREA/.test(e.target.tagName)) stepRx(1);
    else if(e.key==="Tab"){ const f=[...m.querySelectorAll(".sheet button:not([disabled])")]; if(!f.length) return;
      const a=f[0], z=f[f.length-1];
      if(e.shiftKey&&document.activeElement===a){ e.preventDefault(); z.focus(); }
      else if(!e.shiftKey&&document.activeElement===z){ e.preventDefault(); a.focus(); } }
  });
  // swipe down on the handle/header to close (phones)
  m.addEventListener("touchstart",e=>{ rxm.ty=e.target.closest(".hd,.grab")?e.touches[0].clientY:null; },{passive:true});
  m.addEventListener("touchend",e=>{ if(rxm.ty!==null && e.changedTouches[0].clientY-rxm.ty>70) closeRx(); rxm.ty=null; },{passive:true});
  addEventListener("popstate",()=>{ if(!m.hidden){ rxm.pushed=false; closeRx(true); } });
  return rxm.el=m;
}
function paintRx(dir){
  const list=rxList(), i=state.rxIdx, r=list[i]; if(!r) return;
  const t=state.rxType||"Organic", part=rxPartOf(t), tab=RX_TABS[t]?RX_TABS[t].find(([k])=>k===part)[1]:null, x=r.x;
  const steps=(x.m||[]).map(s=>typeof s==="string"?[s]:s);
  const sheet=rxEl().querySelector(".sheet");
  sheet.innerHTML=`<div class="grab" aria-hidden="true"></div>
  <div class="hd"><div style="flex:1;min-width:0"><div class="text-xs" style="color:var(--muted);font-weight:700">${escapeHtml(t)} · ${escapeHtml(state.rxCh)}</div>
    <h3 id="rxTitle" class="text-xl font-bold" style="line-height:1.2;margin-top:2px">${escapeHtml(r.name)}</h3>
    <div class="flex gap-1 mt-2" style="flex-wrap:wrap">${tab?`<span class="tg">${escapeHtml(tab)}</span>`:''}${r.sec!==tab?`<span class="tg">${escapeHtml(r.sec)}</span>`:''}</div></div>
    <button class="x" onclick="closeRx()" aria-label="Close">✕</button></div>
  <div class="bd${dir?' swap':''}" style="--dx:${(dir||0)*24}px">
    <div class="lbl">Reaction</div><div class="eqbox">${escapeHtml(r.eq)}</div>
    ${x.c?`<div class="cond"><b>Conditions</b> ${escapeHtml(x.c)}</div>`:''}
    ${steps.length?`<div class="lbl" style="margin-top:18px">Mechanism · step by step</div><ol class="mech">${steps.map(([s,e])=>`<li><div>${escapeHtml(s)}</div>${e?`<div class="se">${escapeHtml(e)}</div>`:''}</li>`).join("")}</ol>`:''}
    ${x.n?`<div class="keypt"><b>Key point</b> ${escapeHtml(x.n)}</div>`:''}
  </div>
  <div class="ft"><button class="btn btn-ghost" onclick="stepRx(-1)" ${i===0?'disabled style="opacity:.4"':''}>‹ Prev</button>
    <span class="text-sm" style="color:var(--muted);font-weight:700">${i+1} / ${list.length}</span>
    <button class="btn btn-ghost" onclick="stepRx(1)" ${i===list.length-1?'disabled style="opacity:.4"':''}>Next ›</button></div>`;
}
function openRx(i){
  const m=rxEl(), wasOpen=!m.hidden; clearTimeout(rxm.timer); m.classList.remove("out");
  state.rxIdx=i; paintRx();
  if(!wasOpen){
    rxm.last=document.activeElement; m.hidden=false; document.documentElement.style.overflow="hidden";
    try{ history.pushState({rx:1},""); rxm.pushed=true; }catch(e){ rxm.pushed=false; }
    m.querySelector(".x").focus({preventScroll:true});
  }
}
function stepRx(d){
  const n=rxList().length, j=state.rxIdx+d; if(j<0||j>=n) return;
  state.rxIdx=j; paintRx(d);
  const f=rxEl().querySelector(d>0?".ft button:last-child":".ft button:first-child");
  (f&&!f.disabled?f:rxEl().querySelector(".x")).focus({preventScroll:true});
}
function closeRx(fromPop){
  const m=rxEl(); if(m.hidden||m.classList.contains("out")) return;
  m.classList.add("out");
  rxm.timer=setTimeout(()=>{ m.hidden=true; m.classList.remove("out"); },200);
  document.documentElement.style.overflow="";
  if(rxm.pushed&&!fromPop){ rxm.pushed=false; history.back(); }
  if(rxm.last&&document.contains(rxm.last)) rxm.last.focus({preventScroll:true});
}

// ---- background: nebula clouds (tiny canvas, stretched by CSS) and stars (dark theme only), drawn once ----
function hexA(hex, a){ const m = /#?([0-9a-f]{6})/i.exec(String(hex).trim()); if(!m) return `rgba(139,92,246,${a})`; const n = parseInt(m[1], 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function drawCosmos(){
  const w = innerWidth, h = innerHeight, vmax = Math.max(w, h), dark = themeNow() === "dark";
  const nb = document.getElementById("nebCv");
  if(nb){
    const W = w * 1.16, H = h * 1.16, k = .18, g = nb.getContext("2d");
    nb.width = Math.max(32, Math.round(W * k)); nb.height = Math.max(32, Math.round(H * k));
    g.setTransform(k, 0, 0, k, 0, 0); g.clearRect(0, 0, W, H);
    const cs = getComputedStyle(document.documentElement), a = parseFloat(cs.getPropertyValue("--nbo")) || .6, ox = w * .08, oy = h * .08;
    [["--nb1", -.02 * vmax, .02 * vmax, .3 * vmax], ["--nb2", w + .04 * vmax, .22 * h + .4 * vmax, .25 * vmax], ["--nb3", .32 * vmax, h + .12 * vmax, .24 * vmax]].forEach(([v, x, y, r]) => {
      const c = cs.getPropertyValue(v), gr = g.createRadialGradient(x + ox, y + oy, 0, x + ox, y + oy, r);
      gr.addColorStop(0, hexA(c, a)); gr.addColorStop(.55, hexA(c, a * .45)); gr.addColorStop(1, hexA(c, 0));
      g.fillStyle = gr; g.fillRect(x + ox - r, y + oy - r, r * 2, r * 2);
    });
  }
  const c = document.getElementById("cosmosCv"); if(!c) return;
  if(!dark){ c.width = c.height = 1; return; }
  const dpr = 1;            // stars are soft dots, so one canvas pixel per CSS pixel is enough (much lighter for the GPU)
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  const g = c.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  let s = 23; const R = () => (s = (s * 9301 + 49297) % 233280) / 233280, cols = ["255,255,255","205,195,255","180,240,255"];
  const n = Math.round(Math.min(110, w * h / 5000));
  for(let i = 0; i < n; i++){
    const x = R() * w, y = R() * h, r = .35 + R() * 1.1, a = .18 + R() * .5, col = cols[i % 3];
    if(r > 1.2){ const gr = g.createRadialGradient(x, y, 0, x, y, r * 4); gr.addColorStop(0, `rgba(${col},${a * .4})`); gr.addColorStop(1, `rgba(${col},0)`); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * 4, 0, 7); g.fill(); }
    g.fillStyle = `rgba(${col},${a})`; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
}

// ---- numbers that count up when a screen opens ----
function runCountUps(root, all){
  if(!root || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  root.querySelectorAll(all ? "[data-cu]" : ".fresh [data-cu]").forEach(el => {
    const to = +el.dataset.cu; if(!(to > 0)) return;
    const suf = el.dataset.suf || "", dur = Math.min(900, 420 + to), t0 = performance.now() + 150;
    el.textContent = "0" + suf;
    let shown = -1, lastT = 0;
    const step = now => {
      const k = Math.min(1, Math.max(0, (now - t0) / dur));
      if(k >= 1 || now - lastT >= 40){ const v = Math.round(to * (1 - Math.pow(1 - k, 3))); if(v !== shown){ shown = v; el.textContent = v + suf; } lastT = now; }
      if(k < 1 && el.isConnected) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

function goHome(){ clearInterval(state.timerHandle); state.view="home"; state._back=1; render(); window.scrollTo(0,0); }
function leaveExam(){ if(confirm('Go back home? This exam will end and your answers will not be saved.')) goHome(); }

function atomSvg(){ return `<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"><ellipse cx="50" cy="50" rx="40" ry="15"/><ellipse cx="50" cy="50" rx="40" ry="15" transform="rotate(60 50 50)"/><ellipse cx="50" cy="50" rx="40" ry="15" transform="rotate(120 50 50)"/></g><circle cx="50" cy="50" r="10" fill="#fff"/><circle cx="50" cy="50" r="5" style="fill:var(--accent)"/><circle cx="30" cy="15.36" r="7" fill="#3b82ff" stroke="#fff" stroke-width="2.4"/><circle cx="70" cy="15.36" r="7" fill="#ff8a1f" stroke="#fff" stroke-width="2.4"/><circle cx="30" cy="84.64" r="7" fill="#a87bff" stroke="#fff" stroke-width="2.4"/><circle cx="70" cy="84.64" r="7" fill="#1fd88a" stroke="#fff" stroke-width="2.4"/></svg>`; }
function subjColor(s){ return {Physics:"var(--phy)",Chemistry:"var(--che)",Maths:"var(--mat)",Biology:"var(--bio)"}[s]||"var(--accent)"; }
function conf(){ return `<div class="conf">${Array.from({length:30},(_,k)=>`<i style="--x:${(k*37+11)%100};--d:${(k%8)*.12}s;--k:${["#d94f04","#2f6bff","#078a4f","#7a4df0","#f5b301"][k%5]}"></i>`).join("")}</div>`; }

let _dockIdx = -1;          // last selected dock tab, so the highlight can slide from it
function header(active){
  const tabs = [["home","Home"],["study","Study"],["leaderboard","Rankings"],["profile","Profile"],["contact","Contact"]];
  if(["notes","formulae","reactions"].includes(active)) active = "study";
  const idx = tabs.findIndex(t => t[0] === active), from = _dockIdx < 0 || _dockIdx >= tabs.length ? idx : _dockIdx, mv = idx >= 0 && from >= 0 && from !== idx;
  if(idx >= 0) _dockIdx = idx;
  const me = state.profile ? `<button class="arow-me" onclick="nav('profile')" aria-label="Open your profile">${avatarHtml(34)}</button>`
    : state.guest ? `<button class="chip" onclick="logout()">Log in</button>` : "";
  return `<div class="top">
    ${state.view!=="home"?`<button onclick="goHome()" class="back" aria-label="Back to home">${ICONS.back}</button>`:""}
    <span class="logo">${atomSvg()}</span><div class="disp brand">Atomiq</div><span class="tsp"></span>
    <button class="tbtn thm" onclick="toggleTheme(event)" aria-label="${themeNow() === "dark" ? "Switch to light mode" : "Switch to dark mode"}">${ICONS.moon}${ICONS.sun}</button>${me}
  </div>
  <nav class="dock${mv ? " mv" : ""}" style="--nt:${tabs.length};--from:${Math.max(0, from)};--to:${Math.max(0, idx)}">${idx >= 0 ? '<i class="dk-ind" aria-hidden="true"></i>' : ""}${tabs.map(([v,l])=>`<button onclick="nav('${v}')" class="${active===v?'on':''}"${active===v?' aria-current="page"':''}>${ICONS[v]}<span>${l}</span></button>`).join("")}</nav>`;
}

// Player card on Home: level (an element of the periodic table), XP bar, points, rank.
function gameCard(){
  const me = state.game && state.game.me; if(!state.profile || !me) return "";
  const champ = state.game.champ, rank = state.game.rank, lv = levelOf(me.points), fresh = !document.querySelector(".pcard.gcardx");
  const hint = champ ? "You hold the 👑 Golden Badge" : me.points > 0 ? (rank === 2 ? "One place from the 👑 Golden Badge!" : "Reach #1 for the 👑 Golden Badge") : "Take an exam to start earning points";
  return `<button class="pcard gcardx${champ ? " champ" : ""}${fresh ? " fresh" : ""}" onclick="nav('leaderboard')">
    <span class="pc-top">${eltHtml(lv)}
      <span class="pc-lv"><small>LEVEL ${lv.n}</small><b class="disp">${lv.name}</b>
        <span class="xp"><i style="--w:${lv.frac.toFixed(3)}"></i></span>
        <span class="xpl">${lv.next ? `${lv.toNext} XP to ${lv.next.name} (${lv.next.sym})` : "Top of the periodic table!"}</span></span>
      ${champ ? goldBadge(true) : ""}</span>
    <span class="pc-stats">
      <span><b data-cu="${me.points}">${me.points}</b><small>points</small></span>
      <span><b>${me.points > 0 && rank ? "#" + rank : "-"}</b><small>${BOARD_NAMES[myBoard()]} rank</small></span>
      <span><b data-cu="${me.exams}">${me.exams}</b><small>exams</small></span>
      <span><b data-cu="${avgOf(me)}" data-suf="%">${avgOf(me)}%</b><small>average</small></span></span>
    <span class="pc-hint">${hint}<span class="cv" aria-hidden="true">→</span></span></button>`;
}
function tileHtml(s, i){
  const ch = BANK[s].chapters, n = Object.keys(ch).length, q = Object.values(ch).reduce((a, b) => a + b.length, 0), [g1, g2] = subjG(s);
  const pct = q ? Math.round(subjSeen(s) / q * 100) : 0;
  return `<button class="tile" style="--c:${subjColor(s)};--g1:${g1};--g2:${g2};--i:${i}" onclick="state.subject='${s}'; nav('chapters')">
    <span class="t-orb" aria-hidden="true">${miniOrbit(1, 18, 3.6, (-.5 * i).toFixed(2))}${miniOrbit(2, 112, 4.7, (-1.3 * i - .8).toFixed(2))}</span>
    <span class="ti" aria-hidden="true">${BANK[s].icon}</span><b class="disp">${s}</b><small>${n} chapters · ${q} questions</small>
    <span class="t-prog" aria-hidden="true"><i style="--w:${(pct / 100).toFixed(3)}"></i></span><span class="t-pct">${pct ? pct + "% explored" : "Not started yet"}</span></button>`;
}
function renderHome(){
  const subs=mySubjects(); let qn=0,cn=0; subs.forEach(k=>{const c=Object.values(BANK[k].chapters); cn+=c.length; c.forEach(a=>qn+=a.length);});
  const streamNote = (state.profile && STREAM_SUBJECTS[state.profile.stream]) ? ` Showing your <b>${esc(state.profile.stream)}</b> subjects.` : "";
  const tools=[["notes","📝","Short Notes","Chapter-wise notes in simple words","#6246ff","wig"],["formulae","📐","Formula Sheet","Every formula, chapter by chapter","#0ea5e9","swg"],["reactions","⚗️","Chemistry Reactions","Organic, inorganic and physical","#d94f04","bub"]];
  return `${header("home")}
  <section class="hero">${homeHello()}
    <h1><span style="--w:0">Pick</span> <span style="--w:1">a</span> <span style="--w:2">subject.</span><br><span class="gr" style="--w:3">Beat</span> <span class="gr" style="--w:4">the</span> <span class="gr" style="--w:5">clock.</span></h1>
    <p><b data-cu="${qn}" style="min-width:${String(qn).length}ch">${qn}</b> board-style questions across <b data-cu="${cn}" style="min-width:${String(cn).length}ch">${cn}</b> chapters. Choose a subject, then a chapter, and start a timed exam.${streamNote}</p>
    ${state.guest ? `<div class="guestbar"><span>🧪 Practice mode: scores aren't saved.</span><button class="chip" onclick="logout()">Log in / Register</button></div>` : ""}</section>
  <div id="pcSlot">${gameCard()}</div>
  ${continueCard()}
  <div class="sec-h"><h3>Choose a subject</h3><span>${subs.length} subjects</span></div>
  <div class="tiles n${subs.length}">${subs.map(tileHtml).join("")}</div>
  <div class="sec-h"><h3>Study tools</h3><span>swipe for more</span></div>
  <div class="strip">${tools.map(([v,e,t,d,c,an],i)=>`<button class="card tool" style="--i:${i};--c:${c}" onclick="nav('${v}')"><span class="si ${an}" aria-hidden="true">${e}${an==="bub"?"<i></i><i></i><i></i>":""}</span><span><b class="disp">${t}</b><small>${d}</small></span><span class="go" aria-hidden="true">→</span></button>`).join("")}</div>
  ${factCard()}`;
}

function chapterInfo(s, c, n){
  const st = seenStats(s, c), per = Math.min(EXAM_SIZE, n);
  if(!st.seen) return `${n} questions · ${per} per exam`;
  const left = st.total - st.seen;
  return left > 0 ? `${per} per exam · ${left} of ${n} questions still new for you` : `You've seen all ${n}. Next sets start with the oldest ones`;
}
function renderChapters(){
  const subj=state.subject, ch=BANK[subj].chapters, col=subjColor(subj), [g1, g2]=subjG(subj), names=Object.keys(ch);
  const q=Object.values(ch).reduce((a,b)=>a+b.length,0), pct=q?Math.round(subjSeen(subj)/q*100):0;
  return `${header("home")}
  <div class="banner" style="--c:${col};--g1:${g1};--g2:${g2}"><span class="b-orb" aria-hidden="true">${miniOrbit(1, 18, 3.6, 0)}${miniOrbit(2, 112, 4.7, -.9)}<span class="ti">${BANK[subj].icon}</span></span>
    <div><h2>${subj}</h2><p>${names.length} chapters · ${q} questions · pick one to start a timed exam</p><span class="t-prog"><i style="--w:${(pct/100).toFixed(3)}"></i></span><span class="t-pct">${pct}% of questions explored</span></div></div>
  <div class="grid gap-3">
    ${names.map((c,i)=>{
      const n=ch[c].length, ready=n>0, st=ready?seenStats(subj,c):{seen:0,total:0}, frac=st.total?st.seen/st.total:0;
      return `<div class="card crow${frac>=1?' done':''}${i>6?' rv':''}" style="--c:${col};--i:${i}">
        <span class="cnum" aria-hidden="true">${frac>=1?'✓':String(i+1).padStart(2,"0")}</span>
        <div class="cmid"><div class="font-semibold">${esc(c)}</div><div class="text-xs" style="color:${ready?'var(--muted)':'var(--warn)'}">${ready? chapterInfo(subj,c,n) : 'not loaded yet'}</div>${ready?`<span class="cbar" aria-hidden="true"><i style="--w:${frac.toFixed(3)}"></i></span>`:''}</div>
        ${ready
          ? `<button data-c="${esc(c)}" onclick="startExam(state.subject,this.dataset.c)" class="btn btn-primary cgo">${st.seen?ICONS.again+'New set':ICONS.play+'Start'}</button>`
          : `<button data-c="${esc(c)}" onclick="state.contact={topic:'Suggestion',text:'Please add practice questions for '+state.subject+': '+this.dataset.c,sent:false,busy:false};nav('contact')" class="btn btn-ghost cgo">Request</button>`}
      </div>`;
    }).join("")}
  </div>`;
}

function renderExam(){
  const qs=state.examQueue, i=state.examIdx, q=qs[i], col=subjColor(state.subject);
  const dc=q.diff==="Easy"?"diff-easy":q.diff==="Medium"?"diff-med":"diff-hard";
  const answered=Object.keys(state.answers).length, frac=answered/qs.length, from=state._pp||0; state._pp=frac;
  const sw=state._qi!==i, dx=(i>state._qi?1:-1)*30; state._qi=i;
  const left=Math.max(0,state.timerSec), tf=state.timerTotal?left/state.timerTotal:1;
  return `<div style="--c:${col}">
  <div class="xbar"><button onclick="leaveExam()" class="back" aria-label="Leave exam">${ICONS.close}</button><div class="xt"><small>${esc(state.subject)}</small><span class="disp">${esc(state.chapter)}</span></div>
    <div class="timer${left<=60?' low':''}" role="timer" aria-label="Time left"><svg viewBox="0 0 36 36" aria-hidden="true"><circle class="tt" cx="18" cy="18" r="15.5"/><circle id="timerRing" class="tf" cx="18" cy="18" r="15.5" pathLength="100" style="--p:${tf.toFixed(4)}"/></svg><span id="timerDisplay">${fmtTime(left)}</span></div></div>
  <div class="xprog"><div class="prog"><i style="--from:${from.toFixed(3)};--to:${frac.toFixed(3)}"></i></div><span>${answered}/${qs.length}</span></div>
  <div class="pills">${qs.map((_,idx)=>`<button onclick="state.examIdx=${idx}; render()" class="pl ${idx===i?'cur':state.answers[idx]!==undefined?'ok':''}" aria-label="Question ${idx+1}${state.answers[idx]!==undefined?', answered':''}">${idx+1}</button>`).join("")}</div>
  <div class="card qcard${sw?' swap':''}" id="qcard" style="--dx:${dx}px">
    <div class="qhead"><span class="qno">Question ${i+1}<small> / ${qs.length}</small></span><span class="badge ${dc}">${q.diff}</span></div>
    <div class="qmeta">${q.tag}${q.year?', ~'+q.year:''}</div>
    <div class="qtext">${q.q}</div>
    <div class="grid gap-2">${q.opts.map((o,oi)=>`<button onclick="selectAnswer(${i},${oi})" class="opt${state.answers[i]===oi?' sel':''}${state.pop===i+':'+oi?' pop':''}"><span class="ol">${String.fromCharCode(65+oi)}</span><span class="otx">${o}</span><span class="ock" aria-hidden="true">✓</span></button>`).join("")}</div>
  </div>
  <div class="xnav">
    <button onclick="state.examIdx=Math.max(0,state.examIdx-1); render()" class="btn btn-ghost"${i===0?' disabled':''}>← Prev</button>
    <span class="mid">${answered}/${qs.length} answered</span>
    ${i<qs.length-1 ? `<button onclick="state.examIdx++; render()" class="btn btn-ghost">Next →</button>` : `<button onclick="finishExam()" class="btn btn-primary">Submit Exam</button>`}
  </div>
  <div class="text-center mt-4"><button onclick="if(confirm('Submit and end now?')) finishExam()" class="text-xs underline" style="color:var(--muted)">Submit early</button></div>
  <p class="swipe-tip">Tip: swipe the question card left or right to move between questions.</p></div>`;
}

function renderResult(){
  const r = state.lastScore;
  const pct = Math.round((r.correct/r.total)*100), skipped = r.skipped || 0, wrong = r.total - r.correct - skipped;
  const msg = pct>=80 ? "Outstanding! 🔥" : pct>=60 ? "Solid work! 💪" : pct>=40 ? "Getting there 📘" : "Tough one. Let's go again 🔁";
  const [c1, c2] = pct>=75 ? ["#10b981","#22d3ee"] : pct>=50 ? ["#8b5cf6","#22d3ee"] : pct>=35 ? ["#f59e0b","#f97316"] : ["#f43f5e","#fb7185"];
  let xp = "";
  if(state.profile){
    const b = levelOf(r.ptsBefore || 0), a = levelOf((r.ptsBefore || 0) + r.points), up = a.n > b.n;
    xp = `<div class="rxp"><div class="pc-top">${eltHtml(a)}<div class="pc-lv"><small>LEVEL ${a.n}${up ? " · NEW!" : ""}</small><b class="disp">${a.name}</b>
        <span class="xp"><i style="--w:${a.frac.toFixed(3)};--f:${(up ? 0 : b.frac).toFixed(3)}"></i></span>
        <span class="xpl">${a.next ? `${a.toNext} XP to ${a.next.name} (${a.next.sym})` : "Top of the periodic table!"}</span></div></div>
      ${up ? `<div class="lvup">🎉 Level up! You've reached ${a.name} (${a.sym})</div>` : ""}</div>
    <div class="ptsline"><b>+${r.points} points</b>${state.game.rank ? ` · you're now <b>#${state.game.rank}</b> on the ${BOARD_NAMES[myBoard()]} board` : ""}${state.game.champ ? " " + goldBadge(true) : ""}</div>`;
  }
  return `${header("home")}
  ${pct>=60?conf():""}<div class="card rhero" style="--r1:${c1}">
    <div class="ring"><span class="rglow" aria-hidden="true"></span><svg viewBox="0 0 120 120"><defs><linearGradient id="rgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><circle class="rt" cx="60" cy="60" r="52"/><circle class="rf" cx="60" cy="60" r="52" pathLength="100" stroke="url(#rgGrad)" style="--p:${pct}"/></svg><div class="rn" style="--n:${pct}"></div></div>
    <div class="rtitle disp">${msg}</div>
    <div class="rsub">${r.correct} of ${r.total} correct · ${esc(r.chapter)}</div>
    <div class="rchips"><span class="ok" style="--k:0">✓ ${r.correct} correct</span><span class="bad" style="--k:1">✗ ${wrong} wrong</span><span style="--k:2">${skipped} skipped</span>${r.used ? `<span style="--k:3">⏱ ${fmtTime(r.used)}</span>` : ""}</div>
    ${xp}
    <div class="rbtns">
      <button data-s="${esc(r.subject)}" data-c="${esc(r.chapter)}" onclick="startExam(this.dataset.s,this.dataset.c)" class="btn btn-primary">Try a new set</button>
      <button onclick="nav('leaderboard')" class="btn btn-ghost">View Atom Rankings</button>
      <button onclick="nav('home')" class="btn btn-ghost">Home</button>
    </div>
  </div>
  <h3 class="font-bold text-xl mt-6 mb-3">Review your answers</h3>
  ${state.examQueue.map((q,i)=>{
    const yours = state.answers[i], ok = yours===q.ans;
    return `<div class="card rvw rv ${ok?'ok':'bad'}"><span class="rvk" aria-hidden="true">${ok?'✓':'✗'}</span><div style="min-width:0">
      <div class="text-sm font-medium">${i+1}. ${q.q}</div>
      <div class="ya">Your answer: ${yours!==undefined ? q.opts[yours] : "Skipped"} ${ok?"✓":"✗"}</div>
      ${!ok?`<div class="ca">Correct: ${q.opts[q.ans]}</div>`:""}</div></div>`;
  }).join("")}`;
}





function renderChatShell(){
  return `${header("chat")}
  <div class="card p-4 flex flex-col" style="height:60vh">
    <div id="chatMessages" class="flex-1 overflow-y-auto mb-3"></div>
    <div class="flex gap-2">
      <input id="chatInput" placeholder="Ask a doubt, like 'Why is drift velocity so small?'" class="flex-1 px-3 py-2 rounded-xl" style="background:var(--bg);border:1px solid var(--border);color:var(--text)" onkeydown="if(event.key==='Enter'){ sendChat(this.value); this.value=''; }"/>
      <button onclick="const el=document.getElementById('chatInput'); sendChat(el.value); el.value='';" class="btn btn-primary">Send</button>
    </div>
  </div>`;
}

document.addEventListener("pointerdown",e=>{
  const t=e.target.closest(".tile,.btn,.opt,.chip,.pl,.back,.dock button,.tbtn,.tool,.scard,.pcard"); if(!t) return;
  const r=t.getBoundingClientRect(), d=Math.max(r.width,r.height)*2, x=document.createElement("span");
  x.className="rip"; x.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  t.appendChild(x); setTimeout(()=>x.remove(),650);
});
addEventListener("scroll", () => document.documentElement.classList.toggle("scrolled", scrollY > 8), {passive: true});
drawCosmos();
render();
bootFirebase();
</script>
</body>
</html>
