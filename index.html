<style id="arena">
/* ===== Atomiq "cosmic" design system. Moving parts only animate transform and opacity, so phones can run them on the GPU. ===== */
@property --n{syntax:'<integer>';initial-value:0;inherits:false}
:root{--phy:#2f6bff;--che:#d94f04;--mat:#7a4df0;--bio:#078a4f;
  --bg:#f3f1fd;--card:#ffffff;--card-a:rgba(255,255,255,.84);--text:#15132e;--muted:#5d6086;--border:#e2dff4;
  --accent:#6246ff;--accent2:#0f9f62;--danger:#e0434b;--warn:#d98a06;
  --grad:linear-gradient(120deg,#6246ff 0%,#9a44f2 55%,#e8489a 100%);
  --btn:linear-gradient(135deg,#7c66ff 0%,#5a3df5 100%);
  --aurora:linear-gradient(100deg,#22d3ee 0%,#8b5cf6 50%,#ec4899 100%);
  --glow:0 12px 28px -12px rgba(98,70,255,.6);
  --sh:0 1px 2px rgba(21,19,46,.05),0 14px 30px -18px rgba(21,19,46,.32);
  --space:radial-gradient(120% 130% at 100% 0%,#4422a8 0%,#1d1356 40%,#0c0a27 100%);
  --nb1:#c3b1ff;--nb2:#99defd;--nb3:#ffbde1;--nbo:.7;
  color-scheme:light}
:root[data-theme="dark"]{--bg:#070819;--card:#12142f;--card-a:rgba(19,21,50,.82);--text:#eef0ff;--muted:#a4a9d4;--border:#272b5a;
  --accent:#8f7dff;--accent2:#34e3a0;--danger:#ff6b6b;--warn:#fbbf24;
  --glow:0 12px 30px -12px rgba(143,125,255,.7);--sh:0 1px 0 rgba(255,255,255,.04) inset,0 18px 34px -22px #000;
  --nb1:#5b21b6;--nb2:#0e6a87;--nb3:#8a1a52;--nbo:.55;color-scheme:dark}
/* The page colour lives on the fixed .cosmos layer (not on body), so the background stays perfectly still while screens slide during page transitions. */
html{background:var(--bg)}body{background:transparent}
body{font-family:Figtree,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text)}
.disp,h2,h3{font-family:"Bricolage Grotesque",Figtree,ui-sans-serif,system-ui,sans-serif;letter-spacing:-.02em}
.card{background:var(--card-a);border:1px solid var(--border);border-radius:22px;box-shadow:var(--sh)}
button.card{transition:transform .3s cubic-bezier(.3,1.5,.5,1),box-shadow .3s}
button.card:hover{transform:translateY(-4px)}button.card:active{transform:scale(.97)}
.btn{border-radius:14px;font-weight:700;transition:transform .12s,box-shadow .12s,opacity .15s}
.btn-primary{background:var(--btn);color:#fff;box-shadow:0 4px 0 #3a22b8,0 12px 22px -12px rgba(90,61,245,.9)}
.btn-primary:hover{filter:none}
.btn-primary:active{transform:translateY(3px);box-shadow:0 1px 0 #3a22b8,0 6px 14px -10px rgba(90,61,245,.9)}
.btn-primary::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);transform:translateX(-130%);pointer-events:none}
.btn-primary:hover::after{transition:transform .7s ease;transform:translateX(130%)}
.btn-ghost{background:var(--card-a);border:1px solid var(--border);color:var(--text)}
.btn-ghost:active{transform:scale(.96)}
.chip{background:var(--card-a);border:1px solid var(--border);border-radius:999px;padding:.4rem .95rem;font-weight:700;color:var(--text);transition:transform .25s cubic-bezier(.3,1.6,.5,1),background-color .2s,color .2s,border-color .2s}
.chip:hover{transform:translateY(-2px)}.chip:active{transform:scale(.94)}
.chip.active{background:var(--btn);color:#fff;border-color:transparent;box-shadow:var(--glow);animation:pop .35s}
.schip.active{background:var(--sc);box-shadow:0 10px 22px -12px var(--sc)}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}

/* small atoms: the electron follows the ellipse with one composited animation */
.mo .mv{position:absolute;inset:0;will-change:transform;animation:orb24 var(--dur) linear infinite}
@keyframes orb24{0.0%{transform:translate3d(50.00%,0.00%,0)}4.167%{transform:translate3d(48.30%,12.94%,0)}8.333%{transform:translate3d(43.30%,25.00%,0)}12.5%{transform:translate3d(35.36%,35.36%,0)}16.667%{transform:translate3d(25.00%,43.30%,0)}20.833%{transform:translate3d(12.94%,48.30%,0)}25.0%{transform:translate3d(0.00%,50.00%,0)}29.167%{transform:translate3d(-12.94%,48.30%,0)}33.333%{transform:translate3d(-25.00%,43.30%,0)}37.5%{transform:translate3d(-35.36%,35.36%,0)}41.667%{transform:translate3d(-43.30%,25.00%,0)}45.833%{transform:translate3d(-48.30%,12.94%,0)}50.0%{transform:translate3d(-50.00%,0.00%,0)}54.167%{transform:translate3d(-48.30%,-12.94%,0)}58.333%{transform:translate3d(-43.30%,-25.00%,0)}62.5%{transform:translate3d(-35.36%,-35.36%,0)}66.667%{transform:translate3d(-25.00%,-43.30%,0)}70.833%{transform:translate3d(-12.94%,-48.30%,0)}75.0%{transform:translate3d(0.00%,-50.00%,0)}79.167%{transform:translate3d(12.94%,-48.30%,0)}83.333%{transform:translate3d(25.00%,-43.30%,0)}87.5%{transform:translate3d(35.36%,-35.36%,0)}91.667%{transform:translate3d(43.30%,-25.00%,0)}95.833%{transform:translate3d(48.30%,-12.94%,0)}100.0%{transform:translate3d(50.00%,0.00%,0)}}
/* ----- background: soft nebula clouds (drawn small on a canvas and stretched, so cheap for the GPU) and stars ----- */
.cosmos{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;contain:strict;background-color:var(--bg);background-image:radial-gradient(color-mix(in srgb,var(--accent) 16%,transparent) 1px,transparent 1.3px);background-size:22px 22px}

.cosmos #cosmosCv{position:absolute;inset:0;width:100%;height:100%}
:root:not([data-theme="dark"]) .cosmos #cosmosCv{display:none}
.cosmos .tw{position:absolute;width:12px;height:12px;margin:-6px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#fff 16%,rgba(255,255,255,.3) 34%,transparent 70%);opacity:0;animation:twk var(--t,4s) var(--d,0s) ease-in-out infinite}
:root:not([data-theme="dark"]) .cosmos .tw{display:none}

@keyframes nbDrift{to{transform:translate3d(4%,3%,0) scale(1.06)}}
@keyframes twk{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:.9;transform:scale(1.15)}}

/* ----- top bar ----- */
.top,.xbar{display:flex;align-items:center;gap:10px;padding:12px 16px 10px;margin:0 -16px;position:sticky;top:0;z-index:20;background:transparent;border-bottom:1px solid transparent;transition:background-color .25s,border-color .25s,box-shadow .25s}

.logo{position:relative;width:42px;height:42px;border-radius:14px;background:var(--grad);display:grid;place-items:center;font-size:1.3rem;flex:none;box-shadow:var(--glow);overflow:hidden}

.pc-lv .xpl{font-size:.74rem;font-weight:600;letter-spacing:0;color:rgba(255,255,255,.75)}
.pc-top .gold{align-self:flex-start}
.pc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12);text-align:center}
.pc-stats>span{contain:content}.pc-stats b{display:block;font:800 1.25rem/1.15 "Bricolage Grotesque",Figtree,sans-serif;font-variant-numeric:tabular-nums}
.pc-stats small{font-size:.66rem;font-weight:700;color:rgba(255,255,255,.65)}
.pc-hint{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;font-size:.76rem;font-weight:700;color:rgba(255,255,255,.8)}
.pc-hint .cv{margin-left:2px;transition:transform .2s}.pcard:hover .pc-hint .cv{transform:translateX(4px)}
.pcard.fresh{animation:cardIn .8s calc(var(--b,0s) + .25s) cubic-bezier(.2,1.2,.3,1) backwards}
.pcard.fresh .xp i{animation:xpIn 1.5s calc(var(--b,0s) + .7s) cubic-bezier(.2,.8,.2,1) backwards}
.pcard.fresh .elt{animation:eltIn .9s calc(var(--b,0s) + .45s) cubic-bezier(.2,1.5,.3,1) backwards}

/* periodic-table tile for the student's level */
.elt{position:relative;flex:none;width:68px;height:74px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,color-mix(in srgb,var(--ec) 34%,#120d3a),#120d3a 90%);border:1.5px solid color-mix(in srgb,var(--ec) 80%,transparent);box-shadow:0 0 22px -4px var(--ec),inset 0 0 16px -6px var(--ec);color:#fff}
.elt>small{position:absolute;left:7px;top:4px;font-size:.62rem;font-weight:800;opacity:.85}
.elt>b{font:800 1.75rem/1 "Bricolage Grotesque",Figtree,sans-serif;color:var(--ec);text-shadow:0 0 12px color-mix(in srgb,var(--ec) 70%,transparent)}
.elt>i{font-style:normal;font-size:.56rem;font-weight:700;margin-top:3px;opacity:.85;max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eltw{--ec:#a78bfa;position:relative;flex:none;display:block}
.eltw .eo{position:absolute;inset:-12px -19px;pointer-events:none}
.eltw .eo .wl-orbit .ring{border:1.4px solid color-mix(in srgb,var(--ec) 70%,transparent)}
.eltw .eo .wl-orbit .dot{width:12px;height:12px;margin:-6px}
.xp{position:relative;display:block;height:8px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden;margin:4px 0 1px}
.xp i{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,#22d3ee,#8b5cf6 55%,#ec4899);transform-origin:left;transform:scaleX(var(--w,0))}
.xp::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-120%);animation:xpShine 3.2s 2s ease-in-out infinite}

/* continue card, section headings, subject tiles */
.cont{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 12px 12px 14px;position:relative;overflow:hidden}
.cont::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.cont-ic{flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:1.5rem;background:color-mix(in srgb,var(--c) 16%,transparent)}
.cont-t{flex:1;min-width:0;display:flex;flex-direction:column}
.cont-t small{font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.cont-t b{font-weight:800;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cont-t span{font-size:.75rem;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cont .btn{flex:none;padding:.55rem .85rem;font-size:.85rem}
.enter .cont{animation:rise .6s calc(var(--b,0s) + .45s) cubic-bezier(.2,1,.3,1) backwards}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 2px}
.sec-h h3{font-size:1.3rem;font-weight:800}
.sec-h span{font-size:.78rem;font-weight:700;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:12px}
@media(max-width:767px){.tiles.n3 .tile:last-child{grid-column:span 2;min-height:150px}}
@media(min-width:768px){.tiles{grid-template-columns:repeat(4,1fr)}.tiles.n3{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;overflow:hidden;isolation:isolate;min-height:186px;border-radius:28px;padding:16px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;
  background:linear-gradient(200deg,var(--g1) 0%,var(--c) 52%,var(--g2) 100%);box-shadow:0 18px 32px -18px var(--c),inset 0 1px 0 rgba(255,255,255,.28);transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.tile:nth-child(even){margin-top:22px}
.tiles.n3 .tile:last-child{margin-top:0}
.tile::after{content:"";position:absolute;z-index:-1;right:-46px;top:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.3),rgba(255,255,255,0) 68%)}
.tile::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.32) 50%,transparent 62%);transform:translateX(-130%);animation:sheen 6s calc(2.5s + var(--i)*.8s) ease-in-out infinite}
.tile:hover{transform:translateY(-6px) rotate(-1.2deg)}.tile:active{transform:scale(.95)}
.t-orb{position:absolute;right:2px;top:0;width:112px;height:112px;z-index:1;pointer-events:none}
.t-orb .wl-orbit .ring{border-width:1.3px;border-color:rgba(255,255,255,.5)}
.t-orb .wl-orbit .dot{width:11px;height:11px;margin:-5.5px;background:radial-gradient(circle,#fff 0%,#fff 35%,rgba(255,255,255,0) 72%)}
.tile .ti{position:absolute;right:31px;top:30px;width:52px;height:52px;display:grid;place-items:center;font-size:2.3rem;z-index:2;animation:float 4s ease-in-out infinite;animation-delay:calc(var(--i,0)*-1.1s)}
.tile b{position:relative;z-index:2;font-size:1.42rem;font-weight:800;line-height:1.1}
.tile small{position:relative;z-index:2;font-weight:600;line-height:1.35;margin-top:3px;opacity:.95}
.t-prog{position:relative;z-index:2;display:block;height:6px;border-radius:9px;background:rgba(255,255,255,.26);margin-top:10px;overflow:hidden}
.t-prog i{position:absolute;inset:0;border-radius:inherit;background:#fff;transform-origin:left;transform:scaleX(var(--w,0))}
.t-pct{position:relative;z-index:2;font-size:.68rem;font-weight:700;margin-top:5px;opacity:.9}
.enter .t-prog i{animation:xpIn 1.2s calc(var(--b,0s) + 1s + var(--i)*90ms) cubic-bezier(.2,.8,.2,1) backwards}
.ti{display:inline-block}

/* study tools and "did you know" */
.strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:8px 16px 16px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip>button{flex:0 0 76%;scroll-snap-align:start;padding:16px;display:flex;gap:14px;align-items:center;text-align:left;position:relative;overflow:hidden}
@media(min-width:768px){.strip{margin:0;padding-inline:0}.strip>button{flex:1}}
.strip b{font-size:1.08rem}.strip small{display:block;font-size:.76rem;color:var(--muted);font-weight:600;margin-top:2px}
.si{position:relative;font-size:1.9rem;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent)}
.si.wig{animation:wig 4s 1.5s ease-in-out infinite}.si.swg{animation:wig 4.6s 2.6s ease-in-out infinite}
.si.bub i{position:absolute;bottom:18px;left:50%;width:7px;height:7px;margin-left:-3px;border-radius:50%;background:color-mix(in srgb,var(--c) 70%,#fff);opacity:0;animation:bub 2.4s ease-in infinite}
.si.bub i:nth-child(2){margin-left:2px;animation-delay:.8s;width:5px;height:5px}.si.bub i:nth-child(3){margin-left:-8px;animation-delay:1.6s;width:6px;height:6px}
.tool .go{margin-left:auto;color:var(--muted);font-size:1.2rem;transition:transform .2s}.tool:hover .go{transform:translateX(4px)}
.fact{position:relative;overflow:hidden;margin-top:14px;padding:16px 16px 14px 20px}
.fact::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--fc,var(--accent))}
.fact-h{display:flex;align-items:center;gap:8px}
.fact-h b{font-size:1.02rem}
.fact-ic{font-size:1.35rem;display:inline-block;animation:bulb 3s ease-in-out infinite}
.ftag{margin-left:auto;font-size:.68rem;font-weight:800;padding:.18rem .6rem;border-radius:99px;color:var(--fc);background:color-mix(in srgb,var(--fc) 14%,transparent)}
.fact p{margin:8px 0 12px;font-weight:600;line-height:1.55}
.fact.flip p,.fact.flip .ftag{animation:factIn .5s cubic-bezier(.2,1,.3,1)}

/* ----- chapters ----- */
.banner{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;gap:14px;padding:20px 18px;border-radius:28px;color:#fff;margin:6px 0 18px;
  background:linear-gradient(200deg,var(--g1) 0%,var(--c) 55%,var(--g2) 100%);box-shadow:0 18px 32px -18px var(--c)}
.banner::after{content:"";position:absolute;z-index:-1;left:-60px;bottom:-90px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 68%)}
.banner .b-orb{position:relative;flex:none;width:96px;height:96px;display:grid;place-items:center}
.banner .b-orb .ti{font-size:2.4rem;position:relative;z-index:1;animation:float 4s ease-in-out infinite}
.banner .b-orb .wl-orbit .dot{width:12px;height:12px;margin:-6px;background:radial-gradient(circle,#fff 0%,#fff 35%,rgba(255,255,255,0) 72%)}
.banner .b-orb .wl-orbit .ring{border-color:rgba(255,255,255,.5);border-width:1.3px}
.banner>div:last-child{flex:1;min-width:0}
.banner h2{font-size:1.9rem;font-weight:800;line-height:1}.banner p{font-weight:600;font-size:.85rem;margin-top:4px;opacity:.95}
.banner .t-pct{display:block}
.crow{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 12px;position:relative;overflow:hidden;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.crow:hover{transform:translateX(4px)}
.cnum{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font:800 .95rem "Bricolage Grotesque",Figtree,sans-serif;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.crow.done .cnum{background:var(--c);color:#fff}
.cmid{flex:1;min-width:0}.cmid .font-semibold{line-height:1.25}
.cbar{display:block;height:5px;border-radius:9px;background:color-mix(in srgb,var(--c) 14%,transparent);margin-top:7px;overflow:hidden;position:relative}
.cbar i{position:absolute;inset:0;border-radius:inherit;background:var(--c);transform-origin:left;transform:scaleX(var(--w,0))}
.cgo{flex:none;padding:.55rem .8rem;font-size:.85rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.cgo svg{width:14px;height:14px;fill:currentColor}
.enter .crow .cbar i{animation:xpIn 1s calc(.35s + var(--i)*45ms) cubic-bezier(.2,.8,.2,1) backwards}
.xt{flex:1;min-width:0;line-height:1.15;display:flex;flex-direction:column}
.xt small{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.xt span{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ----- exam ----- */
.timer{position:relative;flex:none;display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:99px;background:var(--card-a);border:1px solid var(--border);box-shadow:var(--sh);font:700 .95rem ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.timer svg{width:30px;height:30px;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:4}.timer .tt{stroke:color-mix(in srgb,var(--c) 18%,transparent)}
.timer .tf{stroke:var(--c);stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:calc(100 - var(--p,1)*100);transition:stroke-dashoffset 1s linear,stroke .3s}
.timer.low{color:var(--danger);border-color:var(--danger);animation:beat 1s infinite}.timer.low .tf{stroke:var(--danger)}
.xprog{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.xprog>span{flex:none;font-size:.78rem;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.prog{flex:1;height:10px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--accent)) 14%,var(--border));overflow:hidden;position:relative}
.prog i{position:absolute;inset:0;border-radius:99px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 55%,#fff));transform-origin:left;transform:scaleX(var(--to));animation:progIn .5s cubic-bezier(.2,.9,.3,1) backwards}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.pl{width:34px;height:34px;border-radius:50%;font-weight:800;font-size:.8rem;border:1.5px solid var(--border);background:var(--card-a);color:var(--muted);transition:transform .25s cubic-bezier(.3,1.6,.5,1),background-color .2s,color .2s}
.pl:hover{transform:scale(1.12)}
.pl.ok{background:color-mix(in srgb,var(--c) 18%,var(--card));border-color:color-mix(in srgb,var(--c) 45%,transparent);color:var(--c)}
.pl.cur{background:var(--c);color:#fff;border-color:var(--c);transform:scale(1.14);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.qcard{padding:18px;position:relative;overflow:hidden}
.qcard::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 40%,#ec4899))}
.swap{animation:swap .4s cubic-bezier(.2,1,.3,1) backwards}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.qno{font:800 1.05rem "Bricolage Grotesque",Figtree,sans-serif;color:var(--c)}.qno small{font-size:.78rem;color:var(--muted);font-weight:700}
.qhead .badge{margin-left:auto}
.qmeta{font-size:.74rem;color:var(--muted);font-weight:600;margin-bottom:12px}
.qtext{font-weight:600;font-size:1.1rem;line-height:1.5;margin-bottom:16px}
.badge{display:inline-block;padding:.18rem .65rem;border-radius:99px;font-weight:800;font-size:.72rem;background:color-mix(in srgb,currentColor 13%,transparent)}
.diff-easy{color:var(--accent2)}.diff-med{color:var(--warn)}.diff-hard{color:var(--danger)}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:12px 14px;border-radius:18px;border:2px solid var(--border);background:var(--card-a);transition:transform .25s cubic-bezier(.3,1.5,.5,1),border-color .2s,background-color .2s}
.opt:hover{transform:translateX(4px);border-color:color-mix(in srgb,var(--c) 60%,var(--border))}
.ol{flex:none;width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font-weight:800;background:color-mix(in srgb,var(--c) 10%,var(--bg));color:var(--c);transition:background-color .2s,color .2s,transform .3s}
.otx{flex:1;min-width:0}
.ock{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:900;color:#fff;background:var(--c);transform:scale(0);transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--card));box-shadow:0 10px 22px -16px var(--c)}
.opt.sel .ol{background:var(--c);color:#fff}.opt.sel .ock{transform:scale(1)}
.opt.pop{animation:pop .4s}.opt.pop .ol{animation:olSpin .5s cubic-bezier(.3,1.5,.5,1)}
.xnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:18px}
.xnav .mid{font-size:.82rem;font-weight:700;color:var(--muted)}
.swipe-tip{text-align:center;font-size:.72rem;color:var(--muted);margin-top:10px;font-weight:600}
@media(hover:hover){.swipe-tip{display:none}}

/* ----- result ----- */
.rhero{position:relative;overflow:hidden;padding:26px 18px 22px;text-align:center}
.rhero::before{content:"";position:absolute;left:50%;top:-140px;width:360px;height:360px;margin-left:-180px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--r1) 30%,transparent),transparent 65%);z-index:-1}
.ring{position:relative;width:176px;height:176px;margin:0 auto 8px}.ring svg{width:100%;height:100%}.ring circle{fill:none;stroke-width:11}.ring .rt{stroke:color-mix(in srgb,var(--border) 80%,transparent)}
.ring .rf{stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;stroke-dasharray:100;stroke-dashoffset:calc(100 - var(--p));animation:ringIn 1.3s .25s cubic-bezier(.2,.8,.2,1) backwards}
.ring .rn{position:absolute;inset:0;display:grid;place-items:center;font:800 2.6rem "Bricolage Grotesque",sans-serif;counter-reset:n var(--n);animation:cnt 1.3s .25s cubic-bezier(.2,.8,.2,1) backwards}
.ring .rn::after{content:counter(n)"%"}
.ring .rglow{position:absolute;inset:16px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--r1) 22%,transparent),transparent 70%);animation:wlBeat 2.6s 1.5s ease-in-out infinite}
.rtitle{font-size:1.65rem;font-weight:800;margin-top:4px;animation:stamp .7s 1s cubic-bezier(.2,1.6,.3,1) backwards}
.rsub{color:var(--muted);font-weight:600;margin-top:4px}
.rchips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px}
.rchips span{padding:.3rem .7rem;border-radius:99px;font-size:.78rem;font-weight:800;background:color-mix(in srgb,var(--muted) 12%,transparent);color:var(--muted);animation:rise .5s calc(1.1s + var(--k)*.08s) cubic-bezier(.2,1,.3,1) backwards}
.rchips .ok{color:var(--accent2);background:color-mix(in srgb,var(--accent2) 14%,transparent)}.rchips .bad{color:var(--danger);background:color-mix(in srgb,var(--danger) 13%,transparent)}
.rxp{margin:16px auto 0;max-width:360px;padding:14px;border-radius:20px;color:#fff;background:var(--space);text-align:left;position:relative;overflow:hidden;animation:cardIn .8s 1.3s cubic-bezier(.2,1.2,.3,1) backwards}
.rxp .pc-top{gap:12px}
.rxp .elt{width:58px;height:64px}.rxp .elt>b{font-size:1.45rem}
.xpgain{display:inline-block;font:800 .95rem "Bricolage Grotesque",Figtree,sans-serif;padding:.15rem .6rem;border-radius:99px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);color:#fff;animation:stamp .6s 1.7s cubic-bezier(.2,1.8,.3,1) backwards}
.rxp .xp i{transform:scaleX(var(--w));animation:xpFrom 1.4s 1.8s cubic-bezier(.2,.8,.2,1) backwards}
.lvup{margin-top:10px;padding:8px 10px;border-radius:12px;font-size:.82rem;font-weight:800;text-align:center;background:linear-gradient(90deg,rgba(34,211,238,.25),rgba(236,72,153,.25));animation:stamp .7s 2.6s cubic-bezier(.2,1.6,.3,1) backwards}
.ptsline{margin-top:12px;font-size:.92rem}
.rbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.rvw{display:flex;gap:12px;padding:14px;margin-bottom:10px;border-left:4px solid var(--k)}
.rvw.ok{--k:var(--accent2)}.rvw.bad{--k:var(--danger)}
.rvk{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:.85rem;color:#fff;background:var(--k)}
.rvw .ya{margin-top:6px;font-size:.8rem;font-weight:700;color:var(--k)}.rvw .ca{font-size:.8rem;font-weight:600;color:var(--muted)}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.conf i{position:absolute;top:-16px;left:calc(var(--x)*1%);width:8px;height:14px;border-radius:2px;background:var(--k);animation:fall 2.8s var(--d) cubic-bezier(.3,.6,.5,1) backwards}
.conf i:nth-child(3n){width:10px;height:10px;border-radius:50%}.conf i:nth-child(4n){width:6px;height:16px}

/* ----- bottom dock with a sliding highlight ----- */
.dock{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:min(calc(100vw - 20px),440px);padding:6px;border-radius:26px;
  background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);border:1px solid color-mix(in srgb,var(--border) 85%,transparent);box-shadow:0 18px 40px -16px rgba(20,18,50,.5);}
.dock button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border-radius:20px;font-size:.64rem;font-weight:800;color:var(--muted);transition:color .3s}
.dock button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.dock button:not(.on):hover svg{transform:translateY(-2px) rotate(-6deg)}

/* ----- splash ----- */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;pointer-events:none;
  background:radial-gradient(ellipse at 50% 120%,#3b1d8f 0%,#170f45 38%,#070618 75%);animation:splashOut .55s 1.05s forwards}
#splash .sl{position:relative;display:grid;place-items:center;width:120px;height:120px;animation:spin .9s cubic-bezier(.3,1.4,.5,1) backwards}
#splash .sl::before{content:"";position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,.55),transparent 65%)}
#splash .sl svg{position:relative;width:96px;height:96px;display:block}

/* ----- entry animations (only when a screen first opens) ----- */
.boot .logo{animation:spin .9s var(--b,0s) cubic-bezier(.3,1.4,.5,1) backwards}
.enter .hi-row{animation:rise .6s var(--b,0s) cubic-bezier(.2,1,.3,1) backwards}
.enter .hero h1 span{animation:rise .7s calc(var(--b,0s) + .1s + var(--w)*100ms) cubic-bezier(.2,1,.3,1) backwards}
.enter .hero p{animation:rise .6s calc(var(--b,0s) + .55s) cubic-bezier(.2,1,.3,1) backwards}
.enter .tile{animation:tileIn .8s calc(var(--b,0s) + .6s + var(--i)*90ms) cubic-bezier(.2,1.3,.4,1) backwards}
.enter .sec-h{animation:rise .6s calc(var(--b,0s) + .5s) cubic-bezier(.2,1,.3,1) backwards}
.enter .strip>button{animation:rise .6s calc(var(--b,0s) + .9s + var(--i)*80ms) cubic-bezier(.2,1,.3,1) backwards}
.enter .banner{animation:tileIn .7s cubic-bezier(.2,1.3,.4,1) backwards}
.enter .crow:not(.rv){animation:rise .5s calc(.15s + min(var(--i),14)*40ms) cubic-bezier(.2,1,.3,1) backwards}
.enter .qcard{animation:rise .5s cubic-bezier(.2,1,.3,1) backwards}
.boot .dock{animation:dockIn .7s calc(var(--b,0s) + .2s) cubic-bezier(.2,1.2,.3,1) backwards}
.cu{font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.enter .grid.gap-3>:not(.rv){animation:rise .45s calc(var(--i,0)*45ms) cubic-bezier(.2,1,.3,1) backwards}
.grid.gap-3>:nth-child(2){--i:1}.grid.gap-3>:nth-child(3){--i:2}.grid.gap-3>:nth-child(4){--i:3}.grid.gap-3>:nth-child(5){--i:4}.grid.gap-3>:nth-child(6){--i:5}.grid.gap-3>:nth-child(7){--i:6}.grid.gap-3>:nth-child(n+8){--i:7}
/* items further down the page fade up as they scroll into view (browsers without scroll timelines just show them) */
@supports (animation-timeline:view()){
  .rv{animation:rvIn linear both;animation-timeline:view();animation-range:entry 0% entry 55%}
}
@keyframes rvIn{from{opacity:0;translate:0 34px;scale:.96}}
.lbr{animation:rise .4s calc(var(--i)*45ms) backwards}
#chatMessages>:last-child{animation:rise .3s backwards}

/* ----- page transitions ----- */
/* page entrance: each block of a new screen glides in (from the right going forward, from the left going back) */
:where(#app.enter>:not(.top):not(.dock):not(.welcome):not(.conf)){animation:pgIn .5s calc(var(--b,0s) + var(--pd,0ms)) cubic-bezier(.2,1,.3,1) backwards}
:where(#app>:nth-child(4)){--pd:50ms}:where(#app>:nth-child(5)){--pd:100ms}:where(#app>:nth-child(6)){--pd:150ms}:where(#app>:nth-child(n+7)){--pd:200ms}
html{--pgx:16px}html[data-dir="back"]{--pgx:-16px}
@keyframes pgIn{from{opacity:0;translate:var(--pgx) 8px}}

.chart rect[tabindex]:focus{outline:none}.chart rect[tabindex]:focus-visible{stroke:var(--accent);stroke-width:2}
.ctip{position:absolute;display:none;pointer-events:none;z-index:5;padding:7px 10px;border-radius:10px;background:var(--text);color:var(--bg);box-shadow:0 8px 24px -8px rgba(0,0,0,.4);white-space:nowrap;max-width:240px}
.ctip b{display:block;font-size:1rem}.ctip span{display:block;font-size:.76rem;font-weight:600;white-space:normal}.ctip small{display:block;font-size:.7rem;opacity:.75}
.tview{margin:8px 4px 0;font-size:.85rem}.tview summary{cursor:pointer;color:var(--accent);font-weight:700}
.ttable{width:100%;margin-top:8px;border-collapse:collapse;font-size:.82rem}.ttable th{text-align:left;color:var(--muted);font-size:.7rem;text-transform:uppercase;padding:6px 4px;border-bottom:1px solid var(--border)}
.ttable td{padding:6px 4px;border-bottom:1px solid var(--border);vertical-align:top}.ttable td small{display:block;color:var(--muted)}
/* Contact */
.chero-atoms i{position:absolute;border:2px solid rgba(255,255,255,.28);border-radius:50%;width:150px;height:56px;right:-30px;top:18px;animation:spin2 9s linear infinite}
.chero-atoms i:nth-child(2){transform:rotate(60deg);animation-name:spin3}.chero-atoms i:nth-child(3){transform:rotate(120deg);animation-name:spin4}
@keyframes spin2{to{transform:rotate(360deg)}}@keyframes spin3{from{transform:rotate(60deg)}to{transform:rotate(420deg)}}@keyframes spin4{from{transform:rotate(120deg)}to{transform:rotate(480deg)}}
/* Welcome screen (GPU-friendly: animations only use transform and opacity) */
.welcome{--px:0;--py:0;position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));overflow:hidden;color:#fff;text-align:center;
  background:radial-gradient(ellipse at 50% 120%,#3b1d8f 0%,#170f45 38%,#070618 75%);contain:layout paint}

.welcome.wl-new{--ta:.7s;--tw:1.55s;--th:2.5s;--tn:3.2s;--tb:3.45s}
.welcome.wl-back{--ta:0s;--tw:.55s;--th:1.2s;--tn:1.8s;--tb:2s}
.wl-sky{position:absolute;inset:-4%;pointer-events:none;transform:translate3d(calc(var(--px)*-14px),calc(var(--py)*-14px),0);transition:transform .6s ease-out}
.wl-neb{position:absolute;border-radius:50%;opacity:.5;will-change:transform;animation:wlDrift 18s ease-in-out infinite alternate}
.wl-neb.n1{width:80vmax;height:80vmax;left:-38vmax;top:-34vmax;background:radial-gradient(circle,rgba(124,58,237,.9) 0%,rgba(124,58,237,.35) 30%,rgba(124,58,237,0) 62%)}
.wl-neb.n2{width:70vmax;height:70vmax;right:-34vmax;top:12vh;background:radial-gradient(circle,rgba(14,165,233,.8) 0%,rgba(14,165,233,.3) 30%,rgba(14,165,233,0) 62%);animation-duration:24s}
.wl-neb.n3{width:64vmax;height:64vmax;left:6vw;bottom:-38vmax;background:radial-gradient(circle,rgba(249,115,22,.7) 0%,rgba(249,115,22,.25) 30%,rgba(249,115,22,0) 60%);opacity:.4;animation-duration:21s}
.wl-starcv{position:absolute;inset:0;width:100%;height:100%}
.wl-tw i{position:absolute;width:10px;height:10px;margin:-5px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#fff 18%,rgba(255,255,255,.35) 32%,rgba(255,255,255,0) 70%);opacity:.3;animation:wlTwinkle var(--t) var(--d) ease-in-out infinite}
.wl-motes b{position:absolute;bottom:-24px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,var(--c) 0%,var(--c) 22%,transparent 70%);opacity:0;will-change:transform;animation:wlRise var(--t) var(--d) linear infinite}
.wl-new .wl-sky{animation:wlSkyIn 1.3s .3s ease-out backwards}

/* Big Bang (new students) */
.wl-bang{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.wl-bang>*{position:absolute;left:0;top:0}
.wl-bang .core{width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#fff 4%,rgba(233,227,255,.95) 9%,rgba(167,139,250,.55) 26%,rgba(124,58,237,.18) 48%,rgba(124,58,237,0) 70%);transform:scale(.06);will-change:transform,opacity;animation:wlBang 1.05s cubic-bezier(.5,0,.2,1) forwards}
.wl-bang .shock{width:120vmax;height:120vmax;margin:-60vmax 0 0 -60vmax;border-radius:50%;border:2px solid rgba(190,240,255,.8);opacity:0;transform:scale(.01);will-change:transform,opacity;animation:wlShock 1.15s .3s cubic-bezier(.1,.7,.3,1) forwards}
.wl-bang .shock.s2{border-color:rgba(167,139,250,.7);animation-delay:.5s;animation-duration:1.4s}
.wl-bang .parts i,.wl-pull i{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:radial-gradient(circle,var(--c) 0%,var(--c) 25%,transparent 70%);opacity:0;will-change:transform,opacity}
.wl-bang .parts i{animation:wlBurst 1.4s calc(.35s + var(--d)) cubic-bezier(.1,.8,.25,1) forwards}
.wl-pull{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.wl-pull i{animation:wlConverge .9s var(--d) cubic-bezier(.6,0,.4,1) forwards}

/* the atom: orbits are plain rings; electrons move with two composited translate animations (x and y) */
.wl-atom{--A:min(62vw,300px);position:relative;width:var(--A);height:var(--A);margin-bottom:6px;flex:none;transform:translate3d(calc(var(--px)*10px),calc(var(--py)*10px),0);transition:transform .6s ease-out}
.wl-atom .glow{position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,.45) 0%,rgba(124,58,237,.18) 35%,rgba(124,58,237,0) 65%)}
.wl-atom .nuc{position:absolute;left:33%;top:33%;width:34%;height:34%;border-radius:50%;background:radial-gradient(circle closest-side,#fff 0%,#fff 18%,#e2d9ff 38%,rgba(196,181,253,.75) 60%,rgba(124,58,237,0) 100%);will-change:transform;animation:wlBeat 2.6s ease-in-out infinite}
.wl-orbits{position:absolute;inset:0}
.wl-orbit{position:absolute;inset:0;transform:rotate(var(--rot))}
.wl-orbit .ring{position:absolute;left:7%;top:35%;width:86%;height:30%;border-radius:50%;border:1.6px solid rgba(255,255,255,.55)}
.wl-orbit .ex{position:absolute;left:7%;top:35%;width:86%;height:30%}
.wl-orbit .mx,.wl-orbit .my{position:absolute;inset:0;will-change:transform}
.wl-orbit .mx{animation:wlX calc(var(--dur)/2) cubic-bezier(.37,0,.63,1) infinite alternate}
.wl-orbit .my{animation:wlY calc(var(--dur)/2) calc(var(--dur)/-4) cubic-bezier(.37,0,.63,1) infinite alternate}
.wl-orbit .dot{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px;border-radius:50%;background:radial-gradient(circle,#fff 0%,var(--c) 22%,var(--c) 30%,transparent 68%)}
.wl-orbit.o2 .mx{animation-delay:-1.3s}.wl-orbit.o2 .my{animation-delay:calc(-1.3s + var(--dur)/-4)}
.wl-orbit.o3 .mx{animation-delay:-2.4s}.wl-orbit.o3 .my{animation-delay:calc(-2.4s + var(--dur)/-4)}
/* new: orbits and electrons appear one by one after the bang */
.wl-new .wl-orbit .ring{animation:wlRingIn .8s calc(var(--ta) + .1s) cubic-bezier(.2,1.3,.3,1) backwards}
.wl-new .wl-orbit.o2 .ring{animation-delay:calc(var(--ta) + .3s)}.wl-new .wl-orbit.o3 .ring{animation-delay:calc(var(--ta) + .5s)}
.wl-new .wl-orbit .ex{animation:wlFadeIn .5s calc(var(--ta) + .8s) backwards}
.wl-new .wl-atom .glow{animation:wlFadeIn .8s var(--ta) backwards}
.wl-new .wl-atom .nuc{animation:wlNucIn .8s var(--ta) cubic-bezier(.2,1.4,.3,1) backwards,wlBeat 2.6s 1.8s ease-in-out infinite}
/* returning: the atom spins into place, nucleus beats */
.wl-back .wl-orbits{will-change:transform;animation:wlSpinIn 1s .1s cubic-bezier(.2,1.1,.3,1) backwards}
.wl-back .wl-atom .nuc{animation:wlNucIn .6s .45s cubic-bezier(.2,1.6,.3,1) backwards,wlBeat 1.3s 1.05s ease-in-out 2,wlBeat 2.6s 3.7s ease-in-out infinite}

/* text */
.wl-text{position:relative;max-width:34rem}
.wl-line{font:600 clamp(1.15rem,5vw,1.6rem)/1.45 Figtree,sans-serif;color:rgba(255,255,255,.92)}
.wl-w{display:inline-block;animation:wlWord .6s calc(var(--tw) + var(--i)*80ms) cubic-bezier(.2,1,.3,1) backwards}
.wl-aw{position:relative;animation-name:wlPop;animation-duration:.8s;animation-timing-function:cubic-bezier(.2,1.6,.3,1)}
.wl-atoms{display:inline-block;padding:0 .15em;font:800 1.45em/1 "Bricolage Grotesque",Figtree,sans-serif;letter-spacing:.01em;
  background:linear-gradient(100deg,#7cf8ff 0%,#a78bfa 38%,#ff8ad8 64%,#ffb86b 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.wl-aw::before{content:"";position:absolute;left:-10%;right:-10%;top:5%;bottom:5%;z-index:-1;border-radius:50%;background:radial-gradient(closest-side,rgba(167,139,250,.5),rgba(167,139,250,0))}
.wl-ring{position:absolute;left:-8%;right:-8%;top:50%;height:70%;margin-top:-.35em;border:2px solid rgba(124,248,255,.7);border-radius:50%;will-change:transform;
  animation:wlRingPop .7s calc(var(--tw) + var(--i)*80ms + .2s) cubic-bezier(.2,1.4,.3,1) backwards,wlRing 5s calc(var(--tw) + 1s) linear infinite}
.wl-aw .sp{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:radial-gradient(circle,var(--c) 0%,var(--c) 28%,transparent 70%);opacity:0;
  animation:wlSpark .8s calc(var(--tw) + var(--i)*80ms + .12s) cubic-bezier(.1,.8,.3,1) forwards}
.wl-hello{margin-top:14px;font:800 clamp(2.6rem,13vw,4.4rem)/1.05 "Bricolage Grotesque",Figtree,sans-serif;letter-spacing:-.03em;color:#f3efff;text-shadow:0 0 22px rgba(196,181,253,.5)}
.wl-hello .wd{display:inline-block;white-space:nowrap}
.wl-hello .wl-hat{display:block}                                   /* "Atoms" gets its own line */
.wl-hello .lt{display:inline-block;animation:wlLetter .7s calc(var(--th) + var(--i)*40ms) cubic-bezier(.2,1.5,.3,1) backwards}
.wl-hello .wl-hat .lt{color:transparent;text-shadow:none;background:linear-gradient(100deg,#7cf8ff 0%,#a78bfa 38%,#ff8ad8 64%,#ffb86b 100%);background-size:500% 100%;background-position:calc(var(--j)*25%) 0;-webkit-background-clip:text;background-clip:text}
.wl-name{margin-top:12px;color:rgba(255,255,255,.8);font-weight:600;animation:wlUp .7s var(--tn) cubic-bezier(.2,1,.3,1) backwards}
.wl-go{position:relative;margin-top:26px;padding:.85rem 1.6rem;border-radius:999px;font-weight:800;font-size:1.05rem;color:#170f45;background:linear-gradient(100deg,#7cf8ff,#c4b5fd);box-shadow:0 10px 30px -8px rgba(124,248,255,.6);
  animation:wlBtnIn .7s var(--tb) cubic-bezier(.2,1.5,.3,1) backwards;transition:transform .15s}
.wl-go::before{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid rgba(124,248,255,.8);opacity:0;will-change:transform,opacity;animation:wlPing 2.2s calc(var(--tb) + .8s) ease-out infinite}
.wl-go:active{transform:scale(.96)}

/* leaving: zoom into the atom with a flash */
.wl-flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#fff 0%,#e9e3ff 35%,rgba(233,227,255,0) 70%);opacity:0;pointer-events:none}
.welcome.leaving .wl-atom{animation:wlZoom .65s cubic-bezier(.6,0,.4,1) forwards}
.welcome.leaving .wl-text{animation:wlOut .3s ease-in forwards}
.welcome.leaving .wl-sky{animation:wlWarp .65s cubic-bezier(.6,0,.4,1) forwards}
.welcome.leaving .wl-flash{animation:wlFlash .65s ease-in forwards}

@keyframes wlTwinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
@keyframes wlRise{0%{transform:translate3d(0,0,0);opacity:0}10%{opacity:.85}90%{opacity:.6}100%{transform:translate3d(30px,-110vh,0);opacity:0}}
@keyframes wlDrift{to{transform:translate3d(6vmax,4vmax,0) scale(1.1)}}
@keyframes wlSkyIn{from{opacity:0;transform:scale(1.2)}}
@keyframes wlBang{0%{transform:scale(.06);opacity:1}35%{transform:scale(1);opacity:1}100%{transform:scale(.02);opacity:0}}
@keyframes wlShock{0%{transform:scale(.01);opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes wlBurst{0%{transform:rotate(var(--a)) translateX(0) scale(1.3);opacity:1}70%{opacity:1}100%{transform:rotate(var(--a)) translateX(var(--r)) scale(.4);opacity:0}}
@keyframes wlConverge{0%{transform:rotate(var(--a)) translateX(var(--r)) scale(.4);opacity:0}25%{opacity:1}100%{transform:rotate(var(--a)) translateX(0) scale(1.2);opacity:0}}
@keyframes wlX{from{transform:translateX(-50%)}to{transform:translateX(50%)}}
@keyframes wlY{from{transform:translateY(-50%)}to{transform:translateY(50%)}}
@keyframes wlRingIn{from{opacity:0;transform:scale(.3)}}
@keyframes wlFadeIn{from{opacity:0}}
@keyframes wlNucIn{from{transform:scale(0);opacity:0}}
@keyframes wlBeat{0%,100%{transform:scale(1)}15%{transform:scale(1.14)}30%{transform:scale(.96)}45%{transform:scale(1.08)}}
@keyframes wlSpinIn{from{transform:rotate(-200deg) scale(.15);opacity:0}}
@keyframes wlWord{from{opacity:0;transform:translateY(16px) scale(.92)}}
@keyframes wlPop{0%{opacity:0;transform:scale(.2) rotate(-12deg)}60%{opacity:1;transform:scale(1.28) rotate(4deg)}100%{transform:none}}
@keyframes wlRingPop{from{opacity:0;transform:rotate(-12deg) scale(.2)}to{transform:rotate(-12deg)}}
@keyframes wlRing{from{transform:rotate(-12deg)}to{transform:rotate(348deg)}}
@keyframes wlSpark{0%{opacity:1;transform:rotate(var(--a)) translateX(0)}100%{opacity:0;transform:rotate(var(--a)) translateX(2.4em)}}
@keyframes wlLetter{0%{opacity:0;transform:translateY(46px) rotate(14deg) scale(.5)}100%{opacity:1}}
@keyframes wlUp{from{opacity:0;transform:translateY(22px)}}
@keyframes wlBtnIn{0%{opacity:0;transform:translateY(24px) scale(.7)}}
@keyframes wlPing{0%{opacity:.8;transform:scale(1)}80%,100%{opacity:0;transform:scale(1.25,1.6)}}
@keyframes wlZoom{to{transform:scale(7);opacity:0}}
@keyframes wlOut{to{opacity:0;transform:translateY(30px) scale(.95)}}
@keyframes wlWarp{to{transform:scale(2.4);opacity:0}}
@keyframes wlFlash{0%{opacity:0}60%{opacity:1}100%{opacity:1}}
@media(prefers-reduced-motion:reduce){.welcome,.welcome *,.welcome *::before,.welcome *::after{animation-delay:0s!important}.wl-bang,.wl-pull{display:none}}
/* ----- study: notes, formulae, sliding tabs ----- */
.notes{padding:18px 18px 18px 14px}
.notes p{position:relative;line-height:1.65;margin:0 0 .95rem;padding-left:28px}
.notes p::before{content:"";position:absolute;left:4px;top:.5em;width:11px;height:11px;border-radius:50%;background:var(--sc,var(--accent));box-shadow:0 0 0 4px color-mix(in srgb,var(--sc,var(--accent)) 18%,transparent)}
.notes p:not(:last-child)::after{content:"";position:absolute;left:9px;top:calc(.5em + 16px);bottom:calc(-.95rem + 3px);width:2px;border-radius:2px;background:color-mix(in srgb,var(--sc,var(--accent)) 26%,transparent)}
.notes p:last-child{margin:0}
.enter .notes p{animation:rise .5s calc(.15s + min(var(--k,0),10)*60ms) cubic-bezier(.2,1,.3,1) backwards}
.fgrid{display:grid;gap:10px}
.fcard{padding:12px 14px 13px;border-left:4px solid var(--sc,var(--accent))}
.fcard small{display:block;font-size:.76rem;font-weight:700;color:var(--muted)}
.fcard .fx{margin-top:7px;padding:9px 11px;border-radius:12px;background:color-mix(in srgb,var(--sc,var(--accent)) 9%,var(--bg));font-weight:700;font-size:1.04rem;line-height:1.5;overflow-x:auto}
.scard{display:flex;align-items:center;gap:12px;width:100%}
.snum{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font:800 .9rem "Bricolage Grotesque",Figtree,sans-serif;color:var(--sc,var(--accent));background:color-mix(in srgb,var(--sc,var(--accent)) 13%,transparent)}
.smid{flex:1;min-width:0;display:flex;flex-direction:column}
.scard .cv{flex:none;color:var(--muted);font-size:1.4rem;line-height:1;transition:transform .2s}
.scard:hover .cv{transform:translateX(4px)}
.sh-title{display:flex;align-items:center;gap:10px}
.sh-title .ic{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;background:var(--btn);box-shadow:var(--glow)}
.stabs{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:5px;border-radius:18px;background:var(--card-a);border:1px solid var(--border);box-shadow:var(--sh);margin-bottom:16px}
.stabs button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:.62rem .3rem;border-radius:13px;font-weight:800;font-size:.92rem;color:var(--muted);transition:color .3s,background-color .3s}
.stabs button i{font-style:normal;display:inline-block;transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.stabs button.on{color:#fff}.stabs button.on i{transform:scale(1.18) rotate(-8deg)}
.st-ind{position:absolute;z-index:0;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/3);border-radius:13px;background:var(--btn);box-shadow:var(--glow);transform:translateX(calc(var(--to)*100%))}
.stabs.mv .st-ind{animation:slideX .5s cubic-bezier(.3,1.25,.4,1) backwards}
/* ----- golden badge ----- */
.gold{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:4px;padding:.22rem .7rem;border-radius:99px;font-weight:800;font-size:.8rem;color:#5a3a00;white-space:nowrap;
  background:linear-gradient(110deg,#f7d354 0%,#ffe9a3 45%,#f2b632 100%);box-shadow:0 2px 10px -2px rgba(214,150,0,.6),inset 0 0 0 1px rgba(255,255,255,.5)}
.gold::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.8) 50%,transparent 65%);transform:translateX(-130%);animation:sheen 3.4s ease-in-out infinite}
.gold.sm{font-size:.68rem;padding:.1rem .45rem;vertical-align:middle}
/* ----- Atom Rankings: podium + list ----- */
.lbt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:1.6rem;font-weight:800;line-height:1.15}
.lbt .ic{display:inline-block;animation:spinr 10s linear infinite}
.bdtag{display:inline-block;vertical-align:middle;padding:.15rem .65rem;border-radius:99px;font:800 .78rem Figtree,sans-serif;letter-spacing:0;background:var(--grad);color:#fff;box-shadow:var(--glow)}
.mecard{display:flex;align-items:center;gap:14px;padding:14px 16px;position:relative;overflow:hidden}
.mecard.champ{border:1.5px solid #f2b632;box-shadow:0 10px 30px -14px rgba(214,150,0,.7)}
.me-rank{flex:none;width:66px;height:66px;border-radius:20px;display:grid;place-items:center;background:var(--btn);color:#fff;box-shadow:var(--glow);font:800 1.5rem "Bricolage Grotesque",Figtree,sans-serif}
.me-rank.nr{font:800 .72rem/1.15 Figtree,sans-serif;text-align:center;padding:6px}
.mecard.champ .me-rank{background:linear-gradient(135deg,#f7d354,#e0a31a);color:#4a3000}
.me-mid{flex:1;min-width:0}
.me-mid>small{display:block;font-size:.68rem;font-weight:800;letter-spacing:.1em;color:var(--muted)}
.me-mid>b{display:block;font-size:1.1rem;line-height:1.25}
.me-mid>span{display:block;font-size:.78rem;color:var(--muted);font-weight:600}
.me-mid>.me-gap{display:inline-block;margin-top:6px;padding:.18rem .6rem;border-radius:99px;font-size:.74rem;font-weight:800;color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent)}
.mecard .gold{align-self:flex-start}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:34px 4px 0;margin-bottom:14px}
.pd{flex:1;max-width:132px;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.pd.p1{order:2}.pd.p2{order:1}.pd.p3{order:3}
.pd-av{position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--c);box-shadow:0 0 0 3px var(--bg),0 0 0 5.5px var(--ring,#cfd6e4);animation:avPop .6s calc(.75s + var(--d)) cubic-bezier(.2,1.6,.3,1) backwards}
.pd-av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.p1 .pd-av{width:74px;height:74px;font-size:1.3rem;--ring:#f2b632}.p2{--ring:#b8c2d6}.p3{--ring:#d9935f}
.p1{--d:.5s}.p2{--d:.25s}.p3{--d:0s}
.crown{position:absolute;top:-27px;left:50%;font-size:1.6rem;line-height:1;transform:translateX(-50%) rotate(-12deg);animation:crown 2.6s 1.6s ease-in-out infinite}
.pd>b{margin-top:9px;font-size:.84rem;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

function allQuestionsFor(subject, chapter){
  return BANK[subject].chapters[chapter] || [];
}

function startExam(subject, chapter, minutesOverride){
  const qs = pickExamSet(subject, chapter);
  state.subject = subject; state.chapter = chapter;
  state.examQueue = qs; state.examIdx = 0; state.answers = {}; state._pp = 0; state._qi = -1;
  state.timerSec = state.timerTotal = (minutesOverride || Math.max(5, qs.length*2)) * 60;
  saveLast({s: subject, c: chapter, ts: Date.now()});
  state.view = "exam";
  clearInterval(state.timerHandle);
  state.timerHandle = setInterval(()=>{
    state.timerSec--;
    if(state.timerSec<=0){ clearInterval(state.timerHandle); finishExam(); }
    const t = document.getElementById("timerDisplay"), left = Math.max(0, state.timerSec);
    if(t){ t.textContent = fmtTime(left); const box = t.closest(".timer"); if(box) box.classList.toggle("low", left<=60);
      const ring = document.getElementById("timerRing"); if(ring) ring.style.setProperty("--p", (left / state.timerTotal).toFixed(4)); }
  },1000);
  render();
}

function fmtTime(s){
  const m = Math.floor(s/60), ss = s%60;
  return `${m}:${ss.toString().padStart(2,"0")}`;
}

function selectAnswer(qIdx, optIdx){
  state.answers[qIdx] = optIdx;
  state.pop = qIdx+':'+optIdx; try{ navigator.vibrate && navigator.vibrate(12); }catch(e){} render(); state.pop = null;
}

async function finishExam(){
  clearInterval(state.timerHandle);
  let correct = 0, skipped = 0;
  state.examQueue.forEach((q,i)=>{ if(state.answers[i]===q.ans) correct++; else if(state.answers[i]===undefined) skipped++; });
  const total = state.examQueue.length, pct = Math.round(correct/total*100), before = state.game.me ? state.game.rank : null;
  const ptsBefore = state.game.me ? (state.game.me.points || 0) : 0, used = Math.max(0, (state.timerTotal || 0) - Math.max(0, state.timerSec));
  state.lastScore = { correct, total, skipped, subject: state.subject, chapter: state.chapter, points: correct*10, before, ptsBefore, used };
  saveLast({s: state.subject, c: state.chapter, ts: Date.now(), correct, total});
  state.view = "result";
  markSeen(state.subject, state.chapter, state.examQueue); state.prof.scores = null;
  await saveScore(correct, total);
  await updateBoards(correct, total, pct);
  render();
}

async function saveScore(correct, total){
  if(!F || !state.user || !state.profile) return;
  try{
    const {collection, addDoc, serverTimestamp} = F.fs;
    await addDoc(collection(F.db, "scores"), {
      uid: state.user.uid, name: state.profile.fullName, stream: state.profile.stream,
      subject: state.subject, chapter: state.chapter, correct, total, pct: Math.round((correct/total)*100), ts: serverTimestamp()
    });
  }catch(e){ /* silent */ }
}

  t = String(t || ""); const m = /^(\p{Extended_Pictographic}️?)\s*/u.exec(t), x = document.createElement("div");
  x.className = "toast " + (m ? "emo" : (kind || "ok")); x.setAttribute("role", "status");

function drawWelcomeStars(){
  const c = document.querySelector(".wl-starcv"); if(!c) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2), w = c.clientWidth, h = c.clientHeight;
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  const g = c.getContext("2d"); g.scale(dpr, dpr);
  let s = 11; const R = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const count = Math.round(Math.min(140, w * h / 4200));
  for(let i = 0; i < count; i++){

    if(r > 1.2){ const gr = g.createRadialGradient(x, y, 0, x, y, r * 4); gr.addColorStop(0, `rgba(255,255,255,${a * .5})`); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * 4, 0, 7); g.fill(); }

state.seen = {};                      // {"Subject|Chapter": [question ids, oldest first]}
// Options like "All of these" or the fixed Assertion-Reason choices must keep their order.
const fixedOrder = q => /assertion/i.test(q.q + (q.tag || "")) || q.opts.some(o => /all of (these|the above)|none of (these|the above)|\bboth\b|neither/i.test(o));
function shuffleOptions(q){
  if(fixedOrder(q)) return q;
  const idx = shuffle(q.opts.map((_, i) => i));
  return {...q, opts: idx.map(i => q.opts[i]), ans: idx.indexOf(q.ans)};
}
function pickExamSet(subject, chapter){
  const pool = allQuestionsFor(subject, chapter).map(q => ({...q, id: qid(q)}));
  const order = new Map((state.seen[seenKey(subject, chapter)] || []).map((id, i) => [id, i]));
  let pick = shuffle(pool.filter(q => !order.has(q.id))).slice(0, EXAM_SIZE);       // questions never seen first
  if(pick.length < EXAM_SIZE)                                                         // then the ones seen longest ago
    pick = pick.concat(pool.filter(q => order.has(q.id)).sort((a, b) => order.get(a.id) - order.get(b.id)).slice(0, EXAM_SIZE - pick.length));
  return shuffle(pick).map(shuffleOptions);
}
function seenStats(subject, chapter){
  const pool = allQuestionsFor(subject, chapter), ids = new Set(pool.map(qid));
  const seen = (state.seen[seenKey(subject, chapter)] || []).filter(id => ids.has(id)).length;
  return {total: pool.length, seen};
}
async function markSeen(subject, chapter, qs){
  const k = seenKey(subject, chapter), done = new Set(qs.map(q => q.id));
  state.seen[k] = (state.seen[k] || []).filter(id => !done.has(id)).concat([...done]);
  try{ localStorage.setItem("atomiq_seen_" + (state.user ? state.user.uid : "guest"), JSON.stringify(state.seen)); }catch(e){}
  if(F && state.user && state.profile){
    try{ await F.fs.setDoc(F.fs.doc(F.db, "progress", state.user.uid), {seen: state.seen, updatedAt: F.fs.serverTimestamp()}); }catch(e){}
  }
}

  try{ state.seen = JSON.parse(localStorage.getItem(key) || "{}"); }catch(e){ state.seen = {}; }

async function syncMyBoard(){
  // Load (or create, from past scores) this student's leaderboard entry, then work out their rank.
  if(!F || !state.user || !state.profile) return;
  const {getDoc, getDocs, query, collection, where, writeBatch, serverTimestamp} = F.fs, uid = state.user.uid;
  try{
    const s = await getDoc(entryRef(myBoard(), uid));
    if(s.exists() && s.data().name === state.profile.fullName) state.game.me = s.data();
    else {
      const past = await getDocs(query(collection(F.db, "scores"), where("uid", "==", uid)));
      const e = {uid, name: state.profile.fullName, stream: state.profile.stream, points: 0, exams: 0, sumPct: 0, best: 0, updatedAt: serverTimestamp()};
      past.docs.forEach(d => { const x = d.data(); e.points += (x.correct||0) * 10; e.exams++; e.sumPct += x.pct||0; e.best = Math.max(e.best, x.pct||0); });
      const b = writeBatch(F.db); boardsFor(state.profile.stream).forEach(bd => b.set(entryRef(bd, uid), e)); await b.commit();
      state.game.me = e;
    }
    await refreshRank();
  }catch(e){ /* leaderboard is optional; ignore */ }
}
async function refreshRank(){
  const me = state.game.me; if(!F || !me) return;
  const {query, collection, where, getCountFromServer, orderBy, limit, getDocs} = F.fs;
  try{
    const c = await getCountFromServer(query(collection(F.db, "boards", myBoard(), "entries"), where("points", ">", me.points)));
    state.game.rank = c.data().count + 1;
  }catch(e){
    try{ const top = await getDocs(query(collection(F.db, "boards", myBoard(), "entries"), orderBy("points","desc"), limit(50)));
      const i = top.docs.findIndex(d => d.id === state.user.uid); state.game.rank = i >= 0 ? i + 1 : null; }catch(_){}
  }
  const was = state.game.champ;
  state.game.champ = state.game.rank === 1 && me.points > 0;
  if(state.game.champ && was === false && state.game.announced) toast("👑 You're #1! You earned the Golden Badge.");
  state.game.announced = true;
}
async function updateBoards(correct, total, pct){
  if(!F || !state.user || !state.profile) return;
  const {writeBatch, increment, serverTimestamp} = F.fs, uid = state.user.uid, me = state.game.me || {best:0};
  const best = Math.max(me.best || 0, pct);
  try{
    const b = writeBatch(F.db);
    boardsFor(state.profile.stream).forEach(bd => b.set(entryRef(bd, uid), {uid, name: state.profile.fullName, stream: state.profile.stream,
      points: increment(correct * 10), exams: increment(1), sumPct: increment(pct), best, updatedAt: serverTimestamp()}, {merge: true}));
    await b.commit();
    state.game.me = {...me, uid, name: state.profile.fullName, stream: state.profile.stream, points: (me.points||0) + correct*10, exams: (me.exams||0) + 1, sumPct: (me.sumPct||0) + pct, best};
    await refreshRank();
  }catch(e){}
}

// Shrink the picked photo to a 256×256 square JPEG (about 20–40 KB) so it fits in the free database.
function squareJpeg(file){
  return new Promise((ok, bad) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(img.naturalWidth, img.naturalHeight), c = document.createElement("canvas"); c.width = c.height = 256;
      const g = c.getContext("2d"); g.imageSmoothingQuality = "high";
      g.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, 256, 256);
      URL.revokeObjectURL(url); let q = .85, out = c.toDataURL("image/jpeg", q);
      while(out.length > 200000 && q > .4){ q -= .15; out = c.toDataURL("image/jpeg", q); }
      ok(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); bad(new Error("not an image")); };
    img.src = url;
  });
}

const dayKey = d => { const z = new Date(d); return z.getFullYear() + "-" + (z.getMonth()+1) + "-" + z.getDate(); };
function profileStats(list){
  const qTotal = list.reduce((a, x) => a + (x.total||0), 0), qRight = list.reduce((a, x) => a + (x.correct||0), 0);
  const days = new Set(list.map(x => dayKey(tsDate(x.ts) || 0)));
  let streak = 0; const d = new Date(); if(!days.has(dayKey(d))) d.setDate(d.getDate() - 1);   // today not done yet still keeps yesterday's streak
  while(days.has(dayKey(d))){ streak++; d.setDate(d.getDate() - 1); }
  const subs = mySubjects(); let pool = 0; subs.forEach(s => Object.keys(BANK[s].chapters).forEach(c => pool += BANK[s].chapters[c].length));
  let seen = 0; Object.entries(state.seen || {}).forEach(([k, a]) => { if(subs.includes(k.split("|")[0])) seen += a.length; });
  return {exams: list.length, qTotal, qRight, acc: qTotal ? Math.round(qRight / qTotal * 100) : 0, best: list.reduce((a, x) => Math.max(a, x.pct||0), 0), streak, activeDays: days.size, seen: Math.min(seen, pool), pool};
}

    await F.fs.addDoc(F.fs.collection(F.db, "messages"), {uid: state.user.uid, name: p.fullName, email: p.email, phone: p.phone, stream: p.stream, topic: c.topic, text: t, status: "new", ts: F.fs.serverTimestamp()});
    notifyAdmin("message", {topic: c.topic, text: t});
    c.text = ""; c.busy = false;
    const done = () => { c.sent = true; if(state.view === "contact") render(); };

}

let chatHistory = [];
async function sendChat(text){
  if(!text.trim()) return;
  chatHistory.push({role:"user", content:text});
  renderChat();
  if(!sampleNS){
    chatHistory.push({role:"assistant", content:"Chat isn't available in this viewer right now."});
    renderChat();
    return;
  }
  chatHistory.push({role:"assistant", content:"__typing__"});
  renderChat();
  try{
    const res = await sampleNS(
      [{role:"user", content:`You are a friendly CBSE class 12 PCMB tutor helping with exam doubts. Be concise, clear, and encouraging. Student's question: ${text}`}],
      { modelTier:"default", cache:false }
    );
    chatHistory[chatHistory.length-1] = {role:"assistant", content: res.text || "Hmm, I couldn't get an answer, try again."};
  }catch(e){
    chatHistory[chatHistory.length-1] = {role:"assistant", content:"Something went wrong. Try again in a moment."};
  }
  renderChat();
}

function renderChat(){
  const box = document.getElementById("chatMessages");
  if(!box) return;
  box.innerHTML = chatHistory.map(m=>{
    const isUser = m.role==="user";
    const content = m.content==="__typing__" ? "<em>typing…</em>" : escapeHtml(m.content);
    return `<div class="flex ${isUser?'justify-end':'justify-start'} mb-2">
      <div class="max-w-[80%] px-3 py-2 rounded-2xl text-sm" style="background:${isUser?'var(--accent)':'var(--card)'};color:${isUser?'#fff':'var(--text)'};border:${isUser?'none':'1px solid var(--border)'}">${content}</div>
    </div>`;
  }).join("");
  box.scrollTop = box.scrollHeight;
}

function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

Object.assign(NOTES.Chemistry,{
"d and f Block Elements":["d-block elements fill the (n−1)d orbitals. They show variable oxidation states, form coloured compounds and complexes, are often paramagnetic and are good catalysts.","Variable oxidation states come from the small energy gap between ns and (n−1)d electrons. Colour comes from d-d transitions. Magnetism comes from unpaired electrons.","Zn, Cd and Hg have low melting points and low enthalpy of atomisation because they have no unpaired d electrons for metallic bonding.","Mn shows the highest oxidation state in the first series (+7). KMnO₄ is a strong oxidising agent. Dichromate is orange in acid and chromate is yellow in base.","Lanthanoid contraction: size shrinks steadily across the 4f series because 4f electrons shield poorly. It makes Zr and Hf almost equal in size.","Lanthanoids mostly show +3. Actinoids show a wider range of oxidation states and are radioactive."],
"Coordination Compounds":["A complex has a central metal ion bound to ligands. Coordination number is the number of donor atoms attached. The coordination sphere goes in square brackets.","Ligands can be monodentate (NH₃, Cl⁻), bidentate (en, oxalate) or hexadentate (EDTA). Ring-forming (chelate) complexes are extra stable.","Naming: ligands in alphabetical order, then the metal. Give the oxidation state in Roman numerals. Anionic complexes end in -ate.","Isomerism: structural (ionisation, linkage, coordination, hydrate) and stereo (geometrical cis/trans and optical).","Valence bond theory links hybridisation to shape: sp³ tetrahedral, dsp² square planar, d²sp³ or sp³d² octahedral.","Crystal field theory: ligands split the d orbitals. Strong-field ligands give low-spin complexes; weak-field ligands give high-spin ones. Colour comes from d-d transitions.","Uses: EDTA in hardness titrations, cisplatin in cancer therapy, and metal extraction."],
"Haloalkanes and Haloarenes":["A haloalkane has a halogen on an sp³ carbon. A haloarene has it on an sp² carbon of an aromatic ring.","Boiling point rises with molar mass and falls with branching. They do not dissolve in water but dissolve in organic solvents.","SN1: two steps through a carbocation; tertiary halides favoured; gives racemisation. SN2: one step with back-side attack; primary halides favoured; gives inversion.","Elimination with alcoholic KOH follows Zaitsev's rule: the more substituted alkene is the major product.","Haloarenes are less reactive in substitution because of resonance and the sp² carbon. Electron-withdrawing groups at ortho or para positions help.","Finkelstein: R-Cl + NaI gives R-I. Swarts: uses AgF or Hg₂F₂ to make fluorides. Sandmeyer: diazonium salt to aryl halide. Grignard reagent RMgX is made in dry ether."],
"Alcohols, Phenols and Ethers":["Alcohols can be made from alkenes (hydration, hydroboration-oxidation), from carbonyl compounds by reduction, and from Grignard reagents. Phenol is made by the cumene process.","Alcohols have high boiling points because of hydrogen bonding. Solubility in water falls as the carbon chain grows.","Acidity order: phenol > water > alcohols. Phenol is more acidic because the phenoxide ion is stabilised by resonance.","Lucas test: tertiary alcohols turn cloudy at once, secondary in about 5 minutes, primary not at room temperature.","With conc. H₂SO₄, alcohol gives an alkene at 443 K and an ether at 413 K.","Oxidation: primary alcohol gives aldehyde (with PCC) or acid; secondary gives ketone; tertiary resists oxidation.","Phenol reactions: Reimer-Tiemann gives salicylaldehyde, Kolbe gives salicylic acid, bromine water gives 2,4,6-tribromophenol.","Ethers are made by Williamson synthesis and cleaved by HI."],
"Aldehydes, Ketones and Carboxylic Acids":["The carbonyl carbon is electrophilic, so aldehydes and ketones undergo nucleophilic addition. Aldehydes are more reactive than ketones.","Preparation: oxidation of alcohols, Rosenmund reduction (acyl chloride to aldehyde), Stephen reaction (nitrile to aldehyde), Friedel-Crafts acylation.","Tollens' and Fehling's tests are given by aldehydes only. The iodoform test is given by methyl ketones and CH₃CH(OH)- compounds.","Aldol condensation needs α-hydrogen. Cannizzaro reaction is for aldehydes without α-hydrogen, such as HCHO and benzaldehyde.","Carboxylic acids form hydrogen-bonded dimers, so boiling points are high. They are acidic because the carboxylate ion is resonance stabilised. Electron-withdrawing groups increase acidity.","Acid reactions: esterification, reduction to alcohol with LiAlH₄, Hell-Volhard-Zelinsky (α-halogenation) and decarboxylation."],
"Amines":["Amines are primary, secondary or tertiary. They are basic because nitrogen has a lone pair.","In water, ethylamines rank: secondary > tertiary > primary > NH₃. Aromatic amines are weaker bases than aliphatic ones because the lone pair spreads into the ring.","Hinsberg test separates 1°, 2° and 3° amines. The carbylamine test (CHCl₃ + KOH) is positive only for primary amines and gives a foul-smelling isocyanide.","Preparation: reduction of nitro compounds or nitriles; Gabriel phthalimide synthesis (pure primary amines only); Hoffmann bromamide degradation (amine with one carbon fewer).","Diazonium salts form from aromatic primary amines with NaNO₂ and HCl at 273-278 K. They give Sandmeyer and Gattermann products and coupling to make azo dyes.","Aniline reacts with bromine water to give 2,4,6-tribromoaniline. Acetylation tones down its reactivity."],
"Biomolecules":["Carbohydrates: monosaccharides (glucose, fructose), disaccharides (sucrose, maltose, lactose) and polysaccharides (starch, cellulose, glycogen).","Glucose is an aldohexose and fructose is a ketohexose. Glucose exists in ring form with α and β anomers. Sucrose is non-reducing; maltose and lactose are reducing.","Proteins are chains of α-amino acids joined by peptide bonds. Structures: primary, secondary (α-helix, β-sheet), tertiary, quaternary. Denaturation destroys secondary and tertiary structure.","Enzymes are protein biocatalysts. They are specific and work under mild conditions.","Vitamins A, D, E, K are fat-soluble; B and C are water-soluble. Deficiency: A night blindness, D rickets, C scurvy, B₁ beri-beri, K poor blood clotting.","DNA has deoxyribose and bases A, G, C, T. RNA has ribose and bases A, G, C, U. DNA is a double helix with A=T and G≡C."]
});

Object.assign(NOTES.Maths,{
"Relations and Functions":["A relation can be reflexive, symmetric and transitive. An equivalence relation has all three.","A function gives exactly one output for every input. One-one: different inputs give different outputs. Onto: every element of the codomain is hit. Bijective: both.","Only a bijective function has an inverse.","Composition: (g∘f)(x) = g(f(x)). Usually f∘g ≠ g∘f.","From a set of m elements to a set of n elements there are nᵐ functions."],
"Inverse Trigonometric Functions":["Principal value ranges: sin⁻¹ is [−π/2, π/2], cos⁻¹ is [0, π], tan⁻¹ is (−π/2, π/2), cot⁻¹ is (0, π).","sin⁻¹x + cos⁻¹x = π/2 and tan⁻¹x + cot⁻¹x = π/2.","Identities like sin(sin⁻¹x) = x hold only when x is inside the domain.","The graph of an inverse is the mirror image of the original in the line y = x.","For simplification, substitute x = tanθ, x = sinθ or x = cosθ."],
"Determinants":["A determinant exists only for a square matrix and gives a single number.","Expand along the row or column with the most zeros. Swapping two rows flips the sign. Two equal rows give zero.","If |A| = 0 the matrix is singular and has no inverse. If |A| ≠ 0 it is non-singular and A⁻¹ = adj A / |A|.","For AX = B: if |A| ≠ 0 there is a unique solution. If |A| = 0, check (adj A)B: zero means infinitely many solutions, non-zero means none.","Area of a triangle from coordinates uses a determinant. Zero area means the points are collinear."],
"Continuity and Differentiability":["f is continuous at a when left limit = right limit = f(a).","Differentiable implies continuous, but not the other way round. |x| at 0 is continuous but not differentiable.","Use the chain rule for composite functions, implicit differentiation for mixed x and y, and logarithmic differentiation for xˣ or long products.","Parametric form: dy/dx = (dy/dt)/(dx/dt).","Rolle's theorem and the Mean Value Theorem need f continuous on [a, b] and differentiable on (a, b)."],
"Application of Derivatives":["dy/dx is the rate of change of y with respect to x. For related rates use the chain rule.","f is increasing where f′(x) > 0 and decreasing where f′(x) < 0.","Maxima and minima: first derivative test (look for a sign change) or second derivative test (f″ < 0 gives a maximum, f″ > 0 a minimum).","Slope of tangent = f′(x). Slope of normal = −1/f′(x).","On a closed interval, compare critical points and endpoints for absolute maximum and minimum.","Approximation: Δy ≈ f′(x) Δx."],
"Application of Integrals":["Area under y = f(x) from a to b is ∫ y dx. Sketch the curve first.","Area between two curves = ∫ (upper − lower) dx.","Where the curve crosses the axis, split the integral and add the positive areas.","Know the standard areas: circle, ellipse and parabola cut by a line."],
"Differential Equations":["Order is the highest derivative. Degree is its power, when the equation is polynomial in derivatives.","The general solution has as many arbitrary constants as the order. A particular solution fixes them using given conditions.","Variable separable: move all y terms to one side and all x terms to the other, then integrate.","Homogeneous equation: put y = vx.","Linear first order dy/dx + Py = Q: multiply by the integrating factor e^∫P dx.","To form an equation from a family of curves, differentiate as many times as there are constants."],
"Vector Algebra":["A vector has magnitude and direction. A unit vector is a/|a|.","Dot product is a scalar: a·b = |a||b|cosθ. It is zero for perpendicular vectors.","Cross product is a vector perpendicular to both: |a×b| = |a||b|sinθ. It is zero for parallel vectors.","Projection of a on b = (a·b)/|b|.","Area of a parallelogram = |a×b|. Area of a triangle = ½|a×b|.","Scalar triple product a·(b×c) is the volume of a parallelepiped. Zero means the vectors are coplanar."],
"Three Dimensional Geometry":["Direction cosines l, m, n satisfy l² + m² + n² = 1. Direction ratios are proportional to them.","A line is fixed by a point and a direction. Vector form: r = a + λb. Cartesian form: (x−x₁)/a = (y−y₁)/b = (z−z₁)/c.","Lines are perpendicular if a₁a₂ + b₁b₂ + c₁c₂ = 0, and parallel if the direction ratios are proportional.","Skew lines neither meet nor are parallel. Use the shortest distance formula.","A plane is ax + by + cz + d = 0, where (a, b, c) is the normal direction.","Angle between line and plane uses sinθ. Angle between two planes uses their normals."],
"Linear Programming":["A linear programming problem maximises or minimises a linear objective function subject to linear constraints, with x, y ≥ 0.","The feasible region is the area that satisfies every constraint.","In a bounded region, the optimum is at a corner point. Evaluate Z at each corner and choose the largest or smallest.","For an unbounded region, a maximum or minimum exists only if the half-plane test (Z > M or Z < M) has no common point with the region.","If there is no common region, the problem is infeasible. Two corner points can both be optimal, giving optimal points all along that edge."]
});
